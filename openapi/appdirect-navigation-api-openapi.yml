          description: List of product attributes
          type: array
          items:
            $ref: '#/components/schemas/AttributeWS'
        id:
          description: Id
          type: number
        name:
          description: Name
          type: string
        showOnNavigation:
          description: Show the attribute group in the navigation panel
          type: boolean
        vendorTaggable:
          description: Attribute group can be used to tag products by vendor
