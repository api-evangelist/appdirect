          type: string
        uuid:
          type: string
      example:
        createdOn: 12345
        hint: '...'
        isRequired: true
        key: '...'
        label: '...'
        lastModified: 12345
        option:
        - createdOn: 12345
          label: '...'
          lastModified: 12345
          order: 12345
          uuid: '...'
          value: '...'
        - createdOn: 12345
          label: '...'
          lastModified: 12345
          order: 12345
          uuid: '...'
          value: '...'
        order: 12345
        type: '...'
        uuid: '...'
    SubCategoryWS:
      description: Subcategory linked to a parent category
      type: object
      title: SubCategory
      properties:
        id:
          description: The id
          type: number
        name:
          description: The name
          type: string
        numTaggedProducts:
