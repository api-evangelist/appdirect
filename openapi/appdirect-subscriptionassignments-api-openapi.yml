openapi: 3.0.0
info:
  description: The Companies API allows developers to manage marketplace companies and their user memberships.
  title: Companies AI Embed SubscriptionAssignments API
  license:
    name: Apache License, Version 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  version: v296.0-SNAPSHOT
servers:
- url: https://marketplace.appdirect.com/api
- url: https://virtserver.swaggerhub.com
tags:
- name: SubscriptionAssignments
  x-displayName: Subscription Assignments
paths:
  /account/v2/subscriptions/{subscriptionUuid}/assignments/{userUuid}:
    get:
      description: Retrieve a marketplace user's application assignment for a given subscription.
      tags:
      - SubscriptionAssignments
      summary: Read application assignment for user and subscription
      operationId: resource_Subscription_readSubscriptionAssignment_GET
      x-appdirect-required-scopes:
        ROLE_USER:
        - Allows access as a user and owner of the user entitlement.
        ROLE_CHANNEL_ADMIN:
        - Allows access as a Marketplace Manager for the marketplace.
        ROLE_CORPORATE_ADMIN:
        - Allows access as a Network Manager for the marketplace.
        ROLE_PARTNER_READ:
        - Allows access as a member of the company that owns the subscription.
      parameters:
      - description: Unique identifier of the company subscription in the API request
        name: subscriptionUuid
        in: path
        required: true
        schema:
          type: string
      - description: Unique identifier of the user in the API request
        name: userUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                response:
                  value:
                    uuid: 86b95a62-15d6-4a52-a4a6-1be619073428
                    membership:
