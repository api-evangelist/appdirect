    head:
      description: Retrieve the number of users assigned to a subscription.
      tags:
      - SubscriptionAssignments
      summary: Read application assignment count
      operationId: resource_Subscription_readSubscriptionAssignmentCount_HEAD
      x-appdirect-required-scopes:
        ROLE_USER:
        - Allows access as a member of the company that owns the subscription.
        ROLE_CHANNEL_ADMIN:
        - Allows access as a Marketplace Manager for the marketplace.
        ROLE_CORPORATE_ADMIN:
        - Allows access as a Network Manager for the marketplace.
        ROLE_PARTNER_READ:
        - Allows access to read all marketplace data.
      parameters:
      - description: Unique identifier of the company subscription in the API request
        name: subscriptionUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            headers:
              examples:
                response:
                  value:
                    X-Total-Count: 1
        '401':
          description: Unauthorized or subscription not found
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request HEAD \\\n  --url https://marketplace.appdirect.com/api/account/v2/subscriptions/%7BsubscriptionUuid%7D/assignments"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'HEAD',\n  url: 'https://marketplace.appdirect.com/api/account/v2/subscriptions/%7BsubscriptionUuid%7D/assignments'\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
