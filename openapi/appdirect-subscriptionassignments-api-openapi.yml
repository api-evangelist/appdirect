      - lang: Shell + Curl
        source: "curl --request GET \\\n  --url https://marketplace.appdirect.com/api/account/v2/subscriptions/%7BsubscriptionUuid%7D/assignments/%7BuserUuid%7D"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://marketplace.appdirect.com/api/account/v2/subscriptions/%7BsubscriptionUuid%7D/assignments/%7BuserUuid%7D'\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/account/v2/subscriptions/%7BsubscriptionUuid%7D/assignments/%7BuserUuid%7D\")\n  .get()\n  .build();\n\nResponse response = client.newCall(request).execute();"
    post:
      description: Create an application assignment for a marketplace user.
      tags:
      - SubscriptionAssignments
      summary: Create application assignment
      operationId: resource_Subscription_createSubscriptionAssignment_POST
      x-appdirect-required-scopes:
        ROLE_USER:
        - Allows access as the user that owns the subscription.
        ROLE_BILLING_ADMIN:
        - Allows access as a Billing Admin of the company that owns the subscription.
        ROLE_CHANNEL_ADMIN:
        - Allows access as a Marketplace Manager for the marketplace.
        ROLE_CORPORATE_ADMIN:
        - Allows access as a Network Manager for the marketplace.
        ROLE_PARTNER:
        - Allows access as a member of the company that owns the subscription.
      parameters:
      - description: Unique identifier of the company subscription in the API request
        name: subscriptionUuid
        in: path
        required: true
        schema:
          type: string
      - description: Unique identifier of the user to assign the application to
        name: userUuid
        in: path
        required: true
        schema:
          type: string
      - description: Optional parameter and will be ignored if the APIs are accessed using any role except ROLE_PARTNER
        name: creatorUuid
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCustomAttributeWS'
        description: Optional custom user attributes to associate with the created application assignment
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                response:
                  value:
                    rel: self
                    href: http://appdirect/api/account/v2/subscriptions/a9671d54-6c10-4517-9f8a-0c19025566df/assignments/be1abd0d-fe8d-4b3c-994b-39e86d7f68c2
        '201':
          description: Success, subscription created (async)
        '401':
          description: Unauthorized or subscription/user not found
        '502':
          description: Error occurred
          content:
            application/json:
              examples:
                response:
                  value:
                  - code: EXTERNAL_ERROR
                    message: 'Execution of one of external dependencies failed with message: User with email random@appdirect.com was not found in the linked account.'
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request POST \\\n  --url 'https://marketplace.appdirect.com/api/account/v2/subscriptions/%7BsubscriptionUuid%7D/assignments/%7BuserUuid%7D?creatorUuid=SOME_STRING_VALUE' \\\n  --header 'content-type: application/json' \\\n  --data '{\"name\":\"test1\",\"values\":[\"value1\",\"value2\"]}'"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://marketplace.appdirect.com/api/account/v2/subscriptions/%7BsubscriptionUuid%7D/assignments/%7BuserUuid%7D',\n  qs: {creatorUuid: 'SOME_STRING_VALUE'},\n  headers: {'content-type': 'application/json'},\n  body: {name: 'test1', values: ['value1', 'value2']},\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nMediaType mediaType = MediaType.parse(\"application/json\");\nRequestBody body = RequestBody.create(mediaType, \"{\\\"name\\\":\\\"test1\\\",\\\"values\\\":[\\\"value1\\\",\\\"value2\\\"]}\");\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/account/v2/subscriptions/%7BsubscriptionUuid%7D/assignments/%7BuserUuid%7D?creatorUuid=SOME_STRING_VALUE\")\n  .post(body)\n  .addHeader(\"content-type\", \"application/json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
    delete:
      description: Delete a marketplace user's application assignment.
      tags:
      - SubscriptionAssignments
      summary: Delete application assignment
      operationId: resource_Subscription_deleteSubscriptionAssignment_DELETE
      x-appdirect-required-scopes:
        ROLE_USER:
        - Allows access as the user that owns the subscription.
        ROLE_BILLING_ADMIN:
        - Allows access as a Billing Admin of the company that owns the subscription.
        ROLE_CHANNEL_ADMIN:
        - Allows access as a Marketplace Manager for the marketplace.
        ROLE_CORPORATE_ADMIN:
        - Allows access as a Network Manager for the marketplace.
        ROLE_PARTNER:
        - Allows access to manage all marketplace data.
      parameters:
      - description: Unique identifier of the company subscription in the API request
        name: subscriptionUuid
        in: path
        required: true
        schema:
          type: string
      - description: Unique identifier of the user to remove the application assignment for
        name: userUuid
        in: path
        required: true
        schema:
          type: string
      - description: Disconnect voice connection of Boost application
        name: disconnectVoiceConnection
        in: query
        schema:
          type: boolean
      - description: 'Source of event. Possible values are: APP_SYNC, MICROSOFT_PROVISIONING_MIGRATION'
        name: source
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
        '204':
          description: Account not found
        '401':
          description: Unauthorized or subscription/user not found
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request DELETE \\\n  --url 'https://marketplace.appdirect.com/api/account/v2/subscriptions/%7BsubscriptionUuid%7D/assignments/%7BuserUuid%7D?disconnectVoiceConnection=SOME_BOOLEAN_VALUE&source=SOME_STRING_VALUE'"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'DELETE',\n  url: 'https://marketplace.appdirect.com/api/account/v2/subscriptions/%7BsubscriptionUuid%7D/assignments/%7BuserUuid%7D',\n  qs: {disconnectVoiceConnection: 'SOME_BOOLEAN_VALUE', source: 'SOME_STRING_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/account/v2/subscriptions/%7BsubscriptionUuid%7D/assignments/%7BuserUuid%7D?disconnectVoiceConnection=SOME_BOOLEAN_VALUE&source=SOME_STRING_VALUE\")\n  .delete(null)\n  .build();\n\nResponse response = client.newCall(request).execute();"
