        ROLE_CORPORATE_ADMIN:
        - Allows access as a Network Manager for the marketplace.
        ROLE_PARTNER_READ:
        - Allows access to read all marketplace data.
      parameters:
      - description: Unique identifier of the company subscription in the API request
        name: subscriptionUuid
        in: path
        required: true
        schema:
          type: string
      - description: Zero-based page index
        name: page
        in: query
        schema:
          type: integer
          default: 0
      - description: Search term used to search on different assignment fields
        name: searchText
        in: query
        schema:
          type: string
      - description: The number of search results to return per page
        name: size
        in: query
        schema:
