components:
  schemas:
    GatewayResponseWS:
      type: object
      title: GatewayResponse
      properties:
        avs:
          description: True if address is validated.
          type: boolean
        code:
          description: Code.
          type: string
          nullable: true
        cvv:
          description: True if credit card is validated.
          type: boolean
        message:
          description: Message.
          type: string
          nullable: true
      example:
        avs: true
        code: '...'
        cvv: true
        message: '...'
    PaymentMethod:
      type: string
      description: The supported payment methods
      title: PaymentMethod
      enum:
      - CREDIT_CARD
      - PAYPAL
      - MANUAL
      - EXTERNAL_INVOICE
      - MARKETPLACE_CREDITS
    InvoiceStatus:
      type: string
      title: InvoiceStatus
      enum:
      - PAID
      - UNPAID
      - CARRIED
      - VOIDED
    InvoiceListingWS:
      allOf:
      - $ref: '#/components/schemas/ResourceSupport'
      - type: object
        title: InvoiceListing
        properties:
          company:
            $ref: '#/components/schemas/LinkWS'
          creationDate:
            description: Creation date for the invoice.
            type: number
            nullable: true
          orderIds:
            type: array
            description: Array of Order IDs
            items:
              type: string
          currency:
            $ref: '#/components/schemas/Currency'
          dueDate:
            description: Due date for the invoice.
            type: number
            nullable: true
          invoiceId:
            description: Invoice ID.
            type: number
            nullable: true
          referenceNumber:
            description: Reference number.
            type: string
            nullable: true
          status:
            $ref: '#/components/schemas/InvoiceStatus'
          total:
            description: Invoice total.
            type: number
            nullable: true
          user:
            $ref: '#/components/schemas/LinkWS'
        example:
          company:
            href: '...'
            id: '...'
          creationDate: 12345
          currency: DKK
          dueDate: 12345
          invoiceId: 12345
          links:
          - href: '...'
            rel: '...'
          - href: '...'
            rel: '...'
          referenceNumber: '...'
          status: PAID
          total: 12345
          user:
            href: '...'
            id: '...'
    LinkWS:
      type: object
      title: LinkWS
      properties:
        href:
          type: string
        id:
          type: string
      example:
        href: '...'
        id: '...'
      nullable: true
    Link:
      type: object
      title: Link
      properties:
        href:
          type: string
        rel:
          type: string
      example:
        href: '...'
        rel: '...'
      nullable: true
    PaymentWS:
      allOf:
      - $ref: '#/components/schemas/ResourceSupport'
      - type: object
        title: Payment
        properties:
          amount:
            description: Payment amount.
            type: number
            nullable: true
          company:
            $ref: '#/components/schemas/LinkWS'
          currency:
            $ref: '#/components/schemas/Currency'
          date:
            description: Payment date.
            type: number
            nullable: true
          gatewayResponse:
            $ref: '#/components/schemas/GatewayResponseWS'
          id:
            description: Payment number.
            type: number
            nullable: true
          method:
            $ref: '#/components/schemas/PaymentMethod'
          result:
            $ref: '#/components/schemas/PaymentResult'
          transactionId:
            description: Transaction ID.
            type: string
            nullable: true
          user:
            $ref: '#/components/schemas/LinkWS'
        example:
          amount: 12345
          company:
            href: '...'
            id: '...'
          currency: INR
          date: 12345
          gatewayResponse:
            avs: true
            code: '...'
            cvv: true
            message: '...'
          id: 12345
          links:
          - href: '...'
            rel: '...'
          - href: '...'
            rel: '...'
          method: PAYPAL
          result: GATEWAY_NOT_AVAILABLE
          transactionId: '...'
          user:
            href: '...'
            id: '...'
    ResourceSupport:
      type: object
      title: ResourceSupport
      description: Resource links
      properties:
        links:
          type: array
          description: Resource links
          items:
            $ref: '#/components/schemas/Link'
      example:
        links:
        - href: '...'
          rel: '...'
        - href: '...'
          rel: '...'
      nullable: true
    Currency:
      description: Supported currencies for the system
      type: string
      title: Currency
      enum:
      - USD
      - CAD
      - EUR
      - JPY
      - GBP
      - KRW
      - CHF
      - SEK
      - SGD
      - MYR
      - AUD
      - MXN
      - INR
      - BRL
      - DKK
      - NZD
      - NOK
      - ZAR
      - PHP
      - CNY
      - SAR
      - GTQ
      - IDR
      - ARS
      - COP
      - PEN
      default: USD
    PaymentResult:
      type: string
      title: PaymentResult
      enum:
      - SUCCESSFUL
      - FAILED
      - GATEWAY_NOT_AVAILABLE
      - MANUAL
