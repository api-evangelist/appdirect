          default: '250'
      - description: Exclude free invoices
        name: excludeFree
        in: query
        schema:
          type: boolean
      - description: From date
        name: fromDate
        in: query
        schema:
          type: number
      - description: Sort field
        name: sortField
        in: query
        schema:
          type: string
          enum:
          - DATE
          - INVOICE_ID
          - TOTAL
          default: INVOICE_ID
      - description: Sort order
