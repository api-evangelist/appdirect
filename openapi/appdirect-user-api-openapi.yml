                      locale: en_US
                      lastSuccessfulLogin: 1542820131000
                      openId: http://appdirect/openid/id/8db1c051-73a6-4ff8-a0ce-bc1d80d0f156
                      roles:
                      - ROLE_USER
                      currency: USD
                      customAttributes: []
                      metadata:
                        apsUid: null
                      links:
                      - rel: self
                        href: http://appdirect/api/account/v2/users/8db1c051-73a6-4ff8-a0ce-bc1d80d0f156
