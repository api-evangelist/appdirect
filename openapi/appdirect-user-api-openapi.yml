  /account/v2/users/{userUuid}/temporaryPassword:
    put:
      description: 'Set a temporary password for the given marketplace user.

        User must be active and specified password must meet user''s company password policy.

        Effective company is the last company used by the user.'
      x-appdirect-visible: false
      tags:
      - User
      summary: Set a temporary password
      operationId: resource_User_setTemporaryPassword_PUT
      x-appdirect-required-scopes:
        ROLE_PARTNER:
        - Allows access to read and write all marketplace data.
        ROLE_CORPORATE_ADMIN:
        - Allows access as a Network Manager for the marketplace.
        ROLE_CHANNEL_ADMIN:
        - Allows access as a Marketplace Manager for the marketplace.
        ROLE_SYS_ADMIN:
        - Allows access as a Company Admin for the company.
      parameters:
      - description: Unique identifier of user in the API request
        name: userUuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemporaryPasswordAccountV2'
        description: Temporary password, user require to reset password at next login
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Role hierarchy violation. The user making the request cannot change the password of a user with a higher role than their own.
        '404':
          description: User not found
          content:
            application/json:
              examples:
                response:
                  value:
                  - code: Not Found
                    message: User with UUID=4c8aad2f-288f-41eb-8467-fa7e52bc4fac not found.
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request PUT \\\n  --url https://marketplace.appdirect.com/api/account/v2/users/%7BuserUuid%7D/temporaryPassword \\\n  --header 'content-type: application/json' \\\n  --data '{\"password\":\"temppassword123\"}'"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'PUT',\n  url: 'https://marketplace.appdirect.com/api/account/v2/users/%7BuserUuid%7D/temporaryPassword',\n  headers: {'content-type': 'application/json'},\n  body: {password: 'temppassword123'},\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nMediaType mediaType = MediaType.parse(\"application/json\");\nRequestBody body = RequestBody.create(mediaType, \"{\\\"password\\\":\\\"temppassword123\\\"}\");\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/account/v2/users/%7BuserUuid%7D/temporaryPassword\")\n  .put(body)\n  .addHeader(\"content-type\", \"application/json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
components:
  schemas:
    BoostUser:
      type: object
      title: BoostUser
      properties:
        apsUid:
          type: string
      nullable: true
    EmailAddressAccountV2:
      description: Email address information
      type: object
      title: EmailAddressAccountV2
      properties:
        address:
          description: Email address
          type: string
        type:
          $ref: '#/components/schemas/EmailAddressType'
        verified:
          description: Indicates whether the email address is verified
          type: boolean
      example:
        address: alternate@company.com
        type: WORK
        verified: false
    InactiveUserAccountV2:
      description: User activation information
      type: object
      title: InactiveUserAccountV2
      properties:
        activated:
          description: Is user activated
          type: boolean
        email:
          description: User email
          type: string
        password:
          description: User password
          type: string
        termsOfService:
          description: Indicates whether the user has accepted the terms of service
          type: boolean
        privacyPolicy:
          description: Indicates whether the user has agreed to the privacy policy
          type: boolean
      example:
        email: alex.gonsalez@company2438285395.com
        password: some-password
        activated: true
        termsOfService: true
        privacyPolicy: true
    TemporaryPasswordAccountV2:
      description: Temporary Password
      type: object
      title: TemporaryPasswordAccountV2
      properties:
        password:
          description: Password
          type: string
      example:
        password: temppassword123
    CustomAttributeAccountV2:
      description: Custom attributes
      type: object
      title: CustomAttributeAccountV2
      properties:
        attributeType:
          $ref: '#/components/schemas/AttributeType'
        hint:
          description: Localized hint
          type: string
        label:
          description: Localized label
          type: string
        name:
          description: Name
          type: string
        value:
          description: Value
          type: string
        valueKeys:
          description: Value keys
          type: array
          items:
            type: string
      example:
        name: Company Details
        attributeType: MULTISELECT
        label: Label Names
        hint: ''
        valueKeys:
        - great option
    EmailAddressType:
      type: string
      title: EmailAddressType
      description: Email address type
      enum:
      - PERSONAL
      - WORK
    EducationAccountV2:
      description: User profile's education information
      type: object
      title: EducationAccountV2
      properties:
        current:
          description: If currently still at this school
          type: boolean
        degree:
          description: Degree
          type: string
        endYear:
          description: End year
          type: number
        field:
          description: Field of studies
          type: string
        school:
          description: School
          type: string
        startYear:
          description: Start year
          type: number
