                          unitDependency: null
                          minUnits: 0
                          maxUnits: null
                          meteredUsage: false
                          increment: 1
                          pricePerIncrement: false
                          blockContractDecrease: false
                          blockContractIncrease: false
                          blockOriginalContractDecrease: false
                          amount:
                            USD: 10
                          pricingStrategy: UNIT
                        discount: null
                        primaryPrice: false
                      contract: null
                      previousOrder: null
                      nextOrder: null
                      discount: null
                      paymentPlanId: 2
                      discountId: null
                      activated: false
                      oneTimeOrders: []
                      orderLines:
                      - id: 1
                        type: ITEM
                        unit: USER
                        quantity: 1
                        price: 10
                        listingPrice: 10
                        totalPrice: 10
                        description: Test App 1 - null - Per User Fee
                      parameters: []
                      links:
                      - rel: subscription
                        href: http://appdirect/api/billing/v1/subscriptions/1b577640-9b77-47bc-beb8-ed59accb4836
                      id: 1
                    total: 1
            application/xml:
              schema:
                $ref: '#/components/schemas/OrderDetailedListingWS'
        '404':
          description: Not Found
