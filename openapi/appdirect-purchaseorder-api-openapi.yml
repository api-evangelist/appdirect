      - description: 'Filters orders by type.<br/>NEW: The first order of a subscription. The order contains flat fees (one time or recurring) for this subscription. It is active until the subscription is updated or canceled.<br/>MIGRATION: The order created after a subscription change. The order includes flat fees for both one-time and recurring editions.<br/>ADOPTION: The order created by an administrator who has taken ownership of an application from another user within the same company.<br/>FREE_TRIAL_ACTIVATION: Created when a free trial is manually upgraded to a paid subscription. Any subscription that is updated from free trial to paid automatically keeps its NEW status purchase order.<br/>TERMINATION_FEE: A subscription is canceled that had a termination fee. This purchase order represents the fees incurred as a result of the cancellation.<br/>END_OF_CONTRACT_MIGRATION: Created when a subscription update takes place as a result of a contract extension. If the contract autorenewal is set to either continue without a contract or renew the contract with the same pricing plan, then no migration occurs and the original purchase order is updated to include the new end date for the contract.<br/>REFUND: Created when a refund is performed. The refund purchase order is created for only on-platform refunds. Off-platform refunds do not generate this type of purchase order.<br/>CREDIT: Created during subscription update events. Any subscription update calculates a paid period and a credit period. The credit is then provided to the user to prorate the subscription.<br/>ONE_TIME_FEE: Created if an edition includes one-time setup fees.<br/>ADDITIONAL_FEE: Used for off-order charges. A developer change creates an off-order charge and charges their customer a custom amount outside of the normal subscription cycle.<br/>END_OF_DISCOUNT_MIGRATION: Created after a discount of limited duration expires. This purchase order is created to represent the updated costs without the discount.<br/>METERED_USAGE: A purchase order created to accumulate usage fees during a billing period. The order is only valid for the billing period but it is updated with usage lines over the course of the billing period. A metered purchase order is invoiced in arrears at the end of the billing cycle.'
        name: type
        in: query
        schema:
          type: string
          enum:
          - NEW
          - MIGRATION
          - ADOPTION
          - FREE_TRIAL_ACTIVATION
          - TERMINATION_FEE
          - END_OF_CONTRACT_MIGRATION
          - REFUND
          - CREDIT
          - ONE_TIME_FEE
          - ADDITIONAL_FEE
          - END_OF_DISCOUNT_MIGRATION
          - METERED_USAGE
      - description: Filters orders by payment frequency
        name: frequency
        in: query
        schema:
          type: string
          enum:
          - ONE_TIME
          - MONTHLY
          - QUARTERLY
          - SIX_MONTHS
          - YEARLY
          - TWO_YEARS
          - THREE_YEARS
          - DAILY
      - description: Filters orders by order reference code
        name: orderReferenceCode
