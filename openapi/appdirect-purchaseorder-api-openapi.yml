  /billing/v1/orders/{orderId}/payments:
    get:
      description: List all purchase order payments
      tags:
      - PurchaseOrder
      summary: List all purchase order payments
      operationId: resource_Other_readOrderPayments_GET
      parameters:
      - description: The specific order id for which information is requested
        name: orderId
        in: path
        required: true
        schema:
          type: number
      - description: Number of results to fetch. Used for paging.
        name: count
        in: query
        schema:
          type: string
          default: '250'
      - description: Filter by the start date of the invoice
        name: fromDate
        in: query
        schema:
          type: number
      - description: Filter by method of the payment
        name: method
        in: query
        schema:
          type: string
          enum:
          - ADP_INVOICE
          - ARIBAPAY
          - BT_BILL
          - CLICKANDBUY
          - CLOUDFOUNDRY
          - CREDIT_CARD
          - CUMULA_BILL
          - DTAG
          - EXTERNAL_INVOICE
          - KREDITKARTE
          - LASTSCHRIFT_MRNEXNET
          - MANO_TEO_BILL
          - MANUAL
          - MARKETPLACE_CREDITS
          - NETS_ARVATO_INVOICE
          - NEXTEL
          - PAYPAL
          - ROGERS_CC_DTMF
          - ROGERS_CC_POS
          - SNAP
          - TBILL
          - THISTLE
          - TOICLEARING
      - description: Filter by results of the payment
        name: result
        in: query
        schema:
          type: string
          enum:
          - FAILED
          - GATEWAY_NOT_AVAILABLE
          - MANUAL
          - SUCCESSFUL
      - description: The filed to be used for sorting com.appdirect.backend.api.billing.types.OrderSortWS.
        name: sortField
        in: query
        schema:
          type: string
          enum:
          - AMOUNT
          - DATE
          - PAYMENT_ID
          default: PAYMENT_ID
      - description: Sort order org.springframework.data.domain.Sort.Direction.
        name: sortOrder
        in: query
        schema:
          type: string
          enum:
          - ASC
          - DESC
          default: ASC
      - description: First result index. Used for paging.
        name: start
        in: query
        schema:
          type: string
          default: '0'
      - description: Filter by the end date of the invoice
        name: toDate
        in: query
        schema:
          type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: OK
                type: array
                items:
                  $ref: '#/components/schemas/PaymentWS'
              examples:
                response:
                  value:
                  - paymentNumber: 17
                    date: 1481001027061
                    amount: 10
                    currency: USD
                    result: SUCCESSFUL
                    method: CREDIT_CARD
                    transactionId: 123456abcdef
                    user:
                      id: 091d24f6-7b0c-42a0-84ff-86e1cdcf893c
                      href: http://appdirect/api/account/v1/users/091d24f6-7b0c-42a0-84ff-86e1cdcf893c
