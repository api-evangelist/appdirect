  /marketplace/v1/addons:
    get:
      description: Lists add-on products visible on the current marketplace. An "add-on" is a separate catalog product linked to a parent product via an AppAssociation of type ADDON. Each entry contains the full add-on product payload (same shape as a /listing entry) plus a reference to the parent product. The `parentProductId` and `parentProductUuid` parameters are mutually exclusive — supplying both returns 400 Bad Request.
      tags:
      - Product
      summary: List all add-on products
      operationId: resource_Product_readAddonListing_GET
      parameters:
      - description: Pagination offset (0-based). Combined with count, start + count is capped at 10,000.
        name: start
        in: query
        schema:
          type: integer
          default: 0
      - description: Maximum number of add-ons to return per page. Defaults to 50; capped at 500. Clients performing bulk synchronisation should opt in to a larger page size explicitly (e.g. count=500).
        name: count
        in: query
        schema:
          type: integer
          default: 50
      - description: Filter by parent product numeric ID. Mutually exclusive with parentProductUuid.
        name: parentProductId
        in: query
        schema:
          type: number
      - description: Filter by parent product UUID. Mutually exclusive with parentProductId.
        name: parentProductUuid
        in: query
        schema:
          type: string
      - description: Country code, forwarded to product display logic
        name: country
        in: query
        schema:
          type: string
      - description: Currency code, forwarded to product display logic
        name: currency
        in: query
        schema:
          type: string
      - description: Locale (e.g. en_US). Falls back to the channel default if not specified.
        name: locale
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List of add-on products
          headers:
            X-Total-Count:
              description: Total number of add-on products matching the query (across all pages)
              schema:
                type: integer
          content:
            application/json:
              schema:
                description: List of add-on products
                type: array
                items:
                  $ref: '#/components/schemas/AddonListingWS'
              examples:
                response:
                  value:
