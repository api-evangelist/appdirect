        in: query
        required: false
        description: Locale
        schema:
          type: string
          default: en_US
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentFilterParamList'
              examples:
                response:
                  value:
                  - key: company
                    label: company
                    fields:
                    - key: company.state
                      label: state
                      dataType: text
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
