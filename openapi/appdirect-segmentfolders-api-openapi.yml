components:
  schemas:
    DynamicSegment:
      description: Dynamic segments contain users selected automatically based on filter values, as opposed to manual segments, in which Marketplace Managers select companies manually.
      title: DynamicSegment
      type: object
      properties:
        id:
          description: Segment ID
          type: string
        name:
          description: Segment name
          type: string
          minLength: 1
          maxLength: 255
        code:
          description: Segment codes are unique codes that you can use for B2B integration by using the API to automatically associate companies with segments. Leave this field blank if a segment code is not required. Note that if you modify the code after you create it, your B2B integration might be affected.
          type: string
          minLength: 1
          maxLength: 255
        partner:
          description: Partner name
          type: string
          minLength: 1
          maxLength: 50
        type:
          description: Segment type
          type: string
        filters:
          description: Dynamic filter
          type: array
          items:
            $ref: '#/components/schemas/Filters'
      example:
        id: 04f8d043-10f1-4b89-8c0e-0780e5a62299
        name: iOS users
        partner: APPDIRECT
        type: DYNAMIC
        filters:
        - - conditions:
            - parameter: company.state
              operator: matches
              values:
              - Quebec
            - parameter: company.city
              operator: matches
              values:
              - Montreal
          - conditions:
            - parameter: company.state
              operator: matches
              values:
              - Quebec
            - parameter: company.city
              operator: matches
              values:
              - Montreal
    SegmentFolderRequest:
      description: Segment folder creation request
      title: SegmentFolderRequest
      type: object
      properties:
        name:
          description: Segment folder name
          type: string
          maxLength: 255
      required:
      - name
      example:
        name: Fortune 500 Companies
    Filter:
      description: Filter
      title: Filter
      type: object
      properties:
        operator:
          description: Filter operator
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/FilterExpression'
      required:
      - operator
      - conditions
      example:
        operator: ALL_OF
        conditions:
        - parameter: company.state
          operator: matches
          values:
          - Quebec
        - parameter: company.city
          operator: matches
          values:
          - Montreal
    AvailableCompanySegmentAssociation:
      description: Information about all marketplace companies and associated companies for a segment
      title: AvailableCompanySegmentAssociation
      type: object
      properties:
        name:
          description: The company name
          type: string
          minLength: 1
          maxLength: 255
        id:
          description: The company ID
          type: string
        selected:
          description: Indicates whether this company is associated with the segment
          type: boolean
      required:
      - name
      - id
      - selected
      example:
        name: Canada Company
        id: 04f8d043-10f1-4b89-8c0e-0780e5a62299
        selected: false
    SegmentFolderAndSegments:
      description: Segment folder and segments
      title: SegmentFolderAndSegments
      type: object
      properties:
        id:
          description: Segment folder ID
          type: string
        name:
          description: Segment folder name
          type: string
          maxLength: 255
        partner:
          description: The partner
          type: string
          maxLength: 50
        segments:
          type: array
          description: Segment details
          items:
            $ref: '#/components/schemas/Segment'
      required:
      - name
      example:
        id: 7e3b3bb8-1b75-408b-8cbf-561ccd910479
        name: Fortune 500 Companies
        partner: APPDIRECT
        segments:
        - id: 04f8d043-10f1-4b89-8c0e-0780e5a62299
          name: iOS users
          partner: APPDIRECT
          type: MANUAL
    PagedSegmentFolderAndSegments:
      description: Paged information about the segment folder and associated segments for a partner
      title: PagedSegmentFolderAndSegments
      type: object
      properties:
        content:
          type: array
          description: Information about the segment folder and segments
          items:
            $ref: '#/components/schemas/SegmentFolderAndSegments'
        page:
          $ref: '#/components/schemas/PageMeta'
      example:
        content:
        - id: 7e3b3bb8-1b75-408b-8cbf-561ccd910479
          name: Fortune 500 Companies
          partner: APPDIRECT
          segments:
          - id: 04f8d043-10f1-4b89-8c0e-0780e5a62299
            name: iOS users
            partner: APPDIRECT
            code: IOS
            type: MANUAL
        - id: 7e3b3bb8-1b75-408b-8cbf-561ccd910479
          name: Fortune 100 Companies
          partner: APPDIRECT
          segments:
          - id: 04f8d043-10f1-4b89-8c0e-0780e5a62299
            name: Android users
            partner: APPDIRECT
            code: DROID
            type: MANUAL
        page:
          number: 1
          size: 2
          totalElements: 10
          totalPages: 2
    SegmentFilterParamList:
      description: List of parameters for the dynamic segment filter
      title: SegmentFilterParamList
      type: array
      items:
        $ref: '#/components/schemas/FilterParameter'
      example:
      - key: company
        label: company
        fields:
        - key: company.state
          label: state
          dataType: text
    Segment:
      description: A characteristic shared by segment folder members
      title: Segment
      type: object
      properties:
        id:
          description: Segment ID
          type: string
        name:
          description: Segment name
          type: string
          minLength: 1
          maxLength: 255
        code:
          description: Segment codes are unique codes that you can use for B2B integration by using the API to automatically associate companies with segments. Leave this field blank if a segment code is not required. Note that if you modify the code after you create it, your B2B integration might be affected.
          type: string
          minLength: 1
          maxLength: 255
        partner:
          description: Partner name
          type: string
          minLength: 1
          maxLength: 50
        type:
          description: Segment type
          type: string
          enum:
          - MANUAL
          - DYNAMIC
      example:
        id: 04f8d043-10f1-4b89-8c0e-0780e5a62299
        name: iOS users
        partner: APPDIRECT
        type: MANUAL
    Error:
      type: object
      title: Error
      description: Returned error after failed API call.
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
      example:
        code: EXTERNAL_ERROR
        message: 'Execution of an external dependency failed with message: User with email random@appdirect.com was not found in the linked account.'
    PagedSegment:
      type: object
      description: Data returned from paged read of segment.
      title: PagedSegment
      properties:
        content:
          type: array
          description: Segment details
          items:
            $ref: '#/components/schemas/Segment'
        page:
          $ref: '#/components/schemas/PageMeta'
      example:
        content:
        - id: 9f4e5c52-5258-4193-a132-303f06e9eef1
          name: Canada
          partner: APPDIRECT
          code: CAN
          type: MANUAL
        - id: b1f5af35-ca68-431f-83b7-ef56189924ed
          name: France
          partner: APPDIRECT
          code: FRA
          type: MANUAL
        - id: 5ca15227-da6b-413e-a09c-f8d06ab3dcd7
          name: United States
          partner: APPDIRECT
          code: USA
          type: MANUAL
        page:
          number: 0
          size: 50
          totalElements: 3
          totalPages: 1
    PagedAvailableCompanySegmentAssociation:
      description: Paged information about all marketplace companies, including whether they are associated with the segment
      title: PagedAvailableCompanySegmentAssociation
      type: object
      properties:
        content:
          type: array
          description: Information about all marketplace companies, including whether they are associated with the segment
          items:
            $ref: '#/components/schemas/AvailableCompanySegmentAssociation'
        page:
          $ref: '#/components/schemas/PageMeta'
      example:
        content:
        - name: Canada Company
          id: 04f8d043-10f1-4b89-8c0e-0780e5a62299
