        source: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://marketplace.appdirect.com/api/channel/v1/segments/dynamicSegments/filterParameters',\n  qs: {locale: 'SOME_STRING_VALUE'},\n  headers: {'AD-Tenant': 'SOME_STRING_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
