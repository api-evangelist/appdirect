openapi: 3.2.0
info:
  title: Devs.ai AI Models API
  version: '1.0'
security: []
tags:
- name: AI Models
paths:
  /api/v1/ai-models:
    get:
      tags:
      - AI Models
      summary: List AI models
      description: Retrieves available AI models.
      operationId: listAIModels
      responses:
        '200':
          description: List of AI models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModelListResponse'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    AIModel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        modelFamily:
          type: string
        releaseDate:
          type: string
        externalModelId:
          type: string
        contextSize:
          type: integer
        options:
          type: object
        isVisible:
          type: boolean
        creator:
          type: string
        provider:
          type: string
        isPrivate:
          type: boolean
        usageTier:
          type: string
        isDisabled:
          type: boolean
        capabilities:
          type: object
        benchmarks:
          type: object
    AIModelListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AIModel'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Enter your bearer token in the format **Bearer {token}**. Legacy header X-Authorization is also supported for backwards compatibility.
