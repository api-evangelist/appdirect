    MeteredUsageRequestAccepted:
      title: MeteredUsageRequestAccepted
      type: object
      description: Reported metered usage received and accepted
      properties:
        requestId:
          type: string
          description: Unique system-assigned identifier for the metered usage request. Returned with the response.
        idempotencyKey:
          type: string
          description: Unique caller-generated identifier sent with the metered usage submission.
        queryUsageStatus:
          type: string
          description: API endpoint to fetch the processing status of all metered usage events submitted with the request.
    AccountInfo:
      type: object
      title: AccountInfo
      properties:
        accountIdentifier:
          description: Account identifier
          type: string
          nullable: true
        parentAccountIdentifier:
          description: Parent account identifier. Applies to add-on products.
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/CompanyEntitlementStatus'
      example:
        accountIdentifier: '...'
        parentAccountIdentifier: '...'
        status: INITIALIZED
      nullable: true
    Error:
      type: object
      title: Error
      description: Returned error after failed API call.
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
      example:
        code: EXTERNAL_ERROR
        message: 'Execution of an external dependency failed with message: User with email random@appdirect.com was not found in the linked account.'
    UsageBean:
      type: object
      title: UsageBean
      properties:
        account:
          $ref: '#/components/schemas/AccountInfo'
        addonInstance:
          $ref: '#/components/schemas/AddonInstanceInfo'
        item:
          type: array
          items:
            $ref: '#/components/schemas/UsageItemBean'
      example:
        account:
          accountIdentifier: '...'
          parentAccountIdentifier: '...'
          status: CANCELLED
        addonInstance:
          id: '...'
        item:
        - customUnit: '...'
          description: '...'
          price: 12345
          quantity: 12345
          unit: TIER3_STANDARD_LINE
        - customUnit: '...'
          description: '...'
          price: 12345
          quantity: 12345
          unit: CONTACTS_1000
    UsageItemBean:
      type: object
      title: UsageItemBean
      properties:
        customUnit:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        quantity:
          type: number
          nullable: true
        unit:
          $ref: '#/components/schemas/PricingUnit'
      example:
        customUnit: '...'
        description: '...'
        price: 12345
        quantity: 12345
        unit: OPERATOR
    BillingAPIResult:
      type: object
      title: BillingAPIResult
      properties:
        success:
          description: If the Billing API call was successful.
          type: boolean
        message:
          description: Billing API response.
          type: string
          nullable: true
      example:
        success: false
        message: Metered usage report is not allowed on this entitlement.
    MeteredUsageRequest:
      type: object
      title: MeteredUsageRequest
      description: Metered usage event submission
      properties:
        idempotencyKey:
          type: string
          description: Unique caller-generated identifier for the metered usage that is sent. Ensures duplicate submissions can be identified and an error returned. Required.
        requestGroupId:
          type: string
          description: A caller-generated identifier to group related metered usage requests. For example, 'January 2022' to group all requests that include January billing period events.
          nullable: true
        billable:
          type: boolean
          description: Indicates usage is billable (true) or estimated (false). Required.
        usages:
          type: array
          items:
            $ref: '#/components/schemas/MeteredUsageItem'
          description: List of metered usage events.
