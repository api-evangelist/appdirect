openapi: 3.0.0
info:
  description: The Companies API allows developers to manage marketplace companies and their user memberships.
  title: Companies AI Embed Integration API
  license:
    name: Apache License, Version 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  version: v296.0-SNAPSHOT
servers:
- url: https://marketplace.appdirect.com/api
- url: https://virtserver.swaggerhub.com
tags:
- name: Integration
  x-displayName: Metered Usage
paths:
  /integration/v1/billing/usage:
    post:
      description: Submit usage data to be billed for the given account identifier
      tags:
      - Integration
      summary: Billing Usage V1
      operationId: resource_Other_billUsage_POST
      parameters:
      - description: True if asynchronous. Default value is false.
        name: async
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageBean'
          application/xml:
            schema:
              $ref: '#/components/schemas/UsageBean'
        description: Usage data information.
      responses:
        '200':
          description: Success (only returned when async=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAPIResult'
              examples:
                response:
                  value:
                    success: true
                    message: Bill usage API call succeeded.
            application/xml:
              schema:
                $ref: '#/components/schemas/BillingAPIResult'
        '202':
          description: Accepted (only returned when async=true)
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request POST \\\n  --url 'https://marketplace.appdirect.com/api/integration/v1/billing/usage?async=SOME_BOOLEAN_VALUE' \\\n  --header 'content-type: application/json' \\\n  --data '{\"account\":{\"accountIdentifier\":\"...\",\"parentAccountIdentifier\":\"...\",\"status\":\"CANCELLED\"},\"addonInstance\":{\"id\":\"...\"},\"item\":[{\"customUnit\":\"...\",\"description\":\"...\",\"price\":12345,\"quantity\":12345,\"unit\":\"TIER3_STANDARD_LINE\"},{\"customUnit\":\"...\",\"description\":\"...\",\"price\":12345,\"quantity\":12345,\"unit\":\"CONTACTS_1000\"}]}'"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://marketplace.appdirect.com/api/integration/v1/billing/usage',\n  qs: {async: 'SOME_BOOLEAN_VALUE'},\n  headers: {'content-type': 'application/json'},\n  body: {\n    account: {accountIdentifier: '...', parentAccountIdentifier: '...', status: 'CANCELLED'},\n    addonInstance: {id: '...'},\n    item: [\n      {\n        customUnit: '...',\n        description: '...',\n        price: 12345,\n        quantity: 12345,\n        unit: 'TIER3_STANDARD_LINE'\n      },\n      {\n        customUnit: '...',\n        description: '...',\n        price: 12345,\n        quantity: 12345,\n        unit: 'CONTACTS_1000'\n      }\n    ]\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nMediaType mediaType = MediaType.parse(\"application/json\");\nRequestBody body = RequestBody.create(mediaType, \"{\\\"account\\\":{\\\"accountIdentifier\\\":\\\"...\\\",\\\"parentAccountIdentifier\\\":\\\"...\\\",\\\"status\\\":\\\"CANCELLED\\\"},\\\"addonInstance\\\":{\\\"id\\\":\\\"...\\\"},\\\"item\\\":[{\\\"customUnit\\\":\\\"...\\\",\\\"description\\\":\\\"...\\\",\\\"price\\\":12345,\\\"quantity\\\":12345,\\\"unit\\\":\\\"TIER3_STANDARD_LINE\\\"},{\\\"customUnit\\\":\\\"...\\\",\\\"description\\\":\\\"...\\\",\\\"price\\\":12345,\\\"quantity\\\":12345,\\\"unit\\\":\\\"CONTACTS_1000\\\"}]}\");\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/integration/v1/billing/usage?async=SOME_BOOLEAN_VALUE\")\n  .post(body)\n  .addHeader(\"content-type\", \"application/json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
  /integration/v1/customers/{customerIdentifier}/domains/{domain}/verificationStatus:
    post:
      description: Status verification
      x-appdirect-visible: false
      tags:
      - Integration
      summary: Status verification
      operationId: resource_Other_domainVerificationStatus_POST
      parameters:
      - name: customerIdentifier
        in: path
        required: true
        schema:
          type: string
      - name: domain
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainVerificationStatusWS'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request POST \\\n  --url https://marketplace.appdirect.com/api/integration/v1/customers/%7BcustomerIdentifier%7D/domains/%7Bdomain%7D/verificationStatus \\\n  --header 'content-type: application/json' \\\n  --data '{\"verified\":true}'"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://marketplace.appdirect.com/api/integration/v1/customers/%7BcustomerIdentifier%7D/domains/%7Bdomain%7D/verificationStatus',\n  headers: {'content-type': 'application/json'},\n  body: {verified: true},\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nMediaType mediaType = MediaType.parse(\"application/json\");\nRequestBody body = RequestBody.create(mediaType, \"{\\\"verified\\\":true}\");\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/integration/v1/customers/%7BcustomerIdentifier%7D/domains/%7Bdomain%7D/verificationStatus\")\n  .post(body)\n  .addHeader(\"content-type\", \"application/json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
  /integration/v2/billing/usage:
    post:
      description: Submit preconfigured, custom, or volume-priced metered usage data to be billed for a customer account. <br/> <br/> Volume pricing usage is always preconfigured, not custom. It is processed at 6:00 PM UTC, either on the last day of the billing period or, if delayed billing is configured (always recommended for volume pricing), on the last day of a defined number of days after the billing period ends. It must be submitted in requests that do not include other pricing models.
      tags:
      - Integration
      x-appdirect-api-stage: Early Access
      summary: Billing Usage V2
      operationId: resource_Other_billUsageV2_POST
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeteredUsageRequest'
        description: Metered usage request body. The request body example includes a preconfigured metered usage item followed by a custom metered usage item. For volume price usage, the request is the same.
      responses:
        '202':
          description: Metered usage report successfully received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeteredUsageRequestAccepted'
              examples:
                response:
                  value:
                    requestId: 067464f3-be67-4dd3-b1a3-b2ac75180222
                    idempotencyKey: 20210429-b436h7j2
                    queryUsageStatus: /api/integration/v2/billing/usage/requests/fade1f71-3f40-4f4e-81c1-e835cb459c30
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request POST \\\n  --url https://marketplace.appdirect.com/api/integration/v2/billing/usage \\\n  --header 'content-type: application/json' \\\n  --data '{\"idempotencyKey\":\"string\",\"requestGroupId\":\"string\",\"billable\":true,\"usages\":[{\"accountId\":\"string\",\"usageList\":[{\"eventId\":\"string\",\"eventDate\":\"2019-08-24T14:15:22Z\",\"pricingUnit\":\"string\",\"customUnit\":\"string\",\"quantity\":\"string\",\"unitPrice\":\"string\",\"description\":\"string\",\"currency\":\"string\",\"attributes\":{\"property1\":\"string\",\"property2\":\"string\"}}]}]}'"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://marketplace.appdirect.com/api/integration/v2/billing/usage',\n  headers: {'content-type': 'application/json'},\n  body: {\n    idempotencyKey: 'string',\n    requestGroupId: 'string',\n    billable: true,\n    usages: [\n      {\n        accountId: 'string',\n        usageList: [\n          {\n            eventId: 'string',\n            eventDate: '2019-08-24T14:15:22Z',\n            pricingUnit: 'string',\n            customUnit: 'string',\n            quantity: 'string',\n            unitPrice: 'string',\n            description: 'string',\n            currency: 'string',\n            attributes: {property1: 'string', property2: 'string'}\n          }\n        ]\n      }\n    ]\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nMediaType mediaType = MediaType.parse(\"application/json\");\nRequestBody body = RequestBody.create(mediaType, \"{\\\"idempotencyKey\\\":\\\"string\\\",\\\"requestGroupId\\\":\\\"string\\\",\\\"billable\\\":true,\\\"usages\\\":[{\\\"accountId\\\":\\\"string\\\",\\\"usageList\\\":[{\\\"eventId\\\":\\\"string\\\",\\\"eventDate\\\":\\\"2019-08-24T14:15:22Z\\\",\\\"pricingUnit\\\":\\\"string\\\",\\\"customUnit\\\":\\\"string\\\",\\\"quantity\\\":\\\"string\\\",\\\"unitPrice\\\":\\\"string\\\",\\\"description\\\":\\\"string\\\",\\\"currency\\\":\\\"string\\\",\\\"attributes\\\":{\\\"property1\\\":\\\"string\\\",\\\"property2\\\":\\\"string\\\"}}]}]}\");\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/integration/v2/billing/usage\")\n  .post(body)\n  .addHeader(\"content-type\", \"application/json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
  /integration/v2/billing/usage/requests/{requestId}:
    get:
      description: Retrieve whether the metered usage events submitted with a Billing Usage V2 request were successfully processed. In the Billing Usage V2 response, locate the path that is unique to the request (queryUsageStatus). Use it to retrieve the processing status for the submitted usage events, and error details if applicable.
      tags:
      - Integration
      x-appdirect-api-stage: Early Access
      summary: Fetch usage processing status
      operationId: resource_Other_billUsageV2_GET
      parameters:
      - description: Unique system-assigned identifier for the API request used to submit the metered usage; returned with the Billing Usage V2 submission response.
        name: requestId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully returned usage event processing status
          content:
            application/json:
              examples:
                response:
                  value:
                    requestId: 067464f3-be67-4dd3-b1a3-b2ac75180222
                    idempotencyKey: 20210429-b436h7j2
                    status: FAILED
                    totalUsagesCount: 11
                    processedUsagesCount: 10
                    failedUsagesCount: 1
                    failedUsages:
                    - accountId: 58e8092c-f83c-44d7-bd9a-f7a20adaec63
                      eventId: 19eaa1cdab86766021e94b70a262d12543544ebdf4956bf14fce63d4da6e2b50
                      errorCode: BAD_DATA
                      errorDescription: Usage submitted after deadline (6 PM UTC on last day of billing period)
        '403':
          description: Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request GET \\\n  --url https://marketplace.appdirect.com/api/integration/v2/billing/usage/requests/%7BrequestId%7D"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://marketplace.appdirect.com/api/integration/v2/billing/usage/requests/%7BrequestId%7D'\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/integration/v2/billing/usage/requests/%7BrequestId%7D\")\n  .get()\n  .build();\n\nResponse response = client.newCall(request).execute();"
components:
  schemas:
    MeteredUsageItem:
      title: MeteredUsageItem
      type: object
      description: List of metered usage events associated with a customer's subscription.
      properties:
        accountId:
          type: string
          description: Unique identifier that associates a vendor (ISV), customer company, and subscription. Represents company entitlement. Provided by vendor (ISV) when subscription purchased. Marketplace Managers can locate it in the user interface Integration Event event logs.
        usageList:
          type: array
          description: List of metered usage event details.
          items:
            $ref: '#/components/schemas/UsageItem'
    UsageItem:
      title: UsageItem
      type: object
      description: Details for a preconfigured or custom metered usage event.
      properties:
        eventId:
          type: string
          description: 'ID for each metered usage event. When not assigned: null. Required.'
        eventDate:
          type: string
          format: date-time
          description: 'Date and time the usage event was recorded by the metering system. Format: YYYY-MM-DDTHH:mm:ss.SSSZ. Required.'
        pricingUnit:
          type: string
          description: Unit of measure for reported usage. Associated with a price that will be charged for the usage. Required for preconfigured metered usage.
        customUnit:
          type: string
          description: Unit of measure for reported custom metered usage. The unit is associated with a price (unitPrice). Required for custom metered usage.
        quantity:
          type: string
          description: Total usage in the stated unit of measure (pricingUnit or customUnit). Maximum 10 decimal digits. Required.
        unitPrice:
          type: string
          x-minimum: 0
          description: Price for each unit (customUnit) of reported custom usage. x-mimum is the minimum price allowed. Required for custom metered usage.
        description:
          type: string
          description: Additional description about usage items.
        currency:
          type: string
          description: 'Currency in which the custom metered usage price (unitPrice) is reported. Required only for custom metered usage. Empty string is valid for preconfigured metered usage. Format: ISO 4217. For example: USD, EUR'
        attributes:
          type: object
          description: Additional attributes for usage.
          additionalProperties:
            type: string
    CompanyEntitlementStatus:
      type: string
      title: CompanyEntitlementStatus
      enum:
      - INITIALIZED
      - FAILED
      - FREE_TRIAL
      - FREE_TRIAL_EXPIRED
      - ACTIVE
      - SUSPENDED
      - CANCELLED
