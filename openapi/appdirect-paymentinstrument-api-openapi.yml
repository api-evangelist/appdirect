components:
  schemas:
    CreditCardWS:
      type: object
      title: CreditCard
      required:
      - name
      - number
      - securityCode
      - expirationMonth
      - expirationYear
      properties:
        expirationMonth:
          description: Expiration month. Required field.
          type: number
          maxLength: 12
          minLength: 1
        expirationYear:
          description: Expiration year. Required field.
          type: number
        name:
          description: Name as it appears on credit card. Required field.
          type: string
          maxLength: 255
          minLength: 0
        number:
          description: Credit card number. Required field.
          type: string
          maxLength: 19
          minLength: 0
          nullable: true
        securityCode:
          description: Credit card security code. Required field.
          type: string
          maxLength: 4
          minLength: 3
          nullable: true
        type:
          $ref: '#/components/schemas/CreditCardType'
      example:
        expirationMonth: 12345
        expirationYear: 12345
        name: '...'
        number: '...'
        securityCode: '...'
        type: JCB
    PaymentMethod:
      type: string
      description: The supported payment methods
      title: PaymentMethod
      enum:
      - CREDIT_CARD
      - PAYPAL
      - MANUAL
      - EXTERNAL_INVOICE
      - MARKETPLACE_CREDITS
    CreditCardType:
      type: string
      title: CreditCardType
      enum:
      - VISA
      - MASTERCARD
      - AMEX
      - DISCOVER
      - JCB
      - GATEWAY
    AddressWS:
      type: object
      title: Address
      required:
      - country
      - city
      - zip
      - firstName
      - phone
      - lastName
      - street1
      properties:
        city:
          description: The name of the city or town
          type: string
          maxLength: 255
          minLength: 0
        country:
          description: The country code, in ISO-3166 format
          type: string
          maxLength: 2
          minLength: 0
        state:
          description: The state, province, or region
          type: string
          maxLength: 255
          minLength: 0
        firstName:
          description: The first name
          type: string
          maxLength: 255
          minLength: 0
        lastName:
          description: The last name
          type: string
          maxLength: 255
          minLength: 0
        phone:
          description: The phone number
          type: string
          maxLength: 255
