openapi: 3.0.0
info:
  description: The Companies API allows developers to manage marketplace companies and their user memberships.
  title: Companies AI Embed PaymentInstrument API
  license:
    name: Apache License, Version 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  version: v296.0-SNAPSHOT
servers:
- url: https://marketplace.appdirect.com/api
- url: https://virtserver.swaggerhub.com
tags:
- name: PaymentInstrument
  x-displayName: Payment Instruments
paths:
  /billing/v1/companies/{companyId}/users/{userId}/paymentInstruments:
    get:
      description: List all of the payment instruments for the given user
      tags:
      - PaymentInstrument
      summary: List all payment instruments for a user
      operationId: resource_Other_readUserPaymentInstruments_GET
      parameters:
      - description: User's company UUID
        name: companyId
        in: path
        required: true
        schema:
          type: string
      - description: User UUID
        name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: OK
                type: array
                items:
                  $ref: '#/components/schemas/PaymentInstrumentWS'
              examples:
                response:
                  value:
                  - id: e3f7f37b-1e0b-4f05-a8b2-aae74e2f5f2d
                    company:
                      id: 7ee20d50-8147-482e-839c-775c02e73c45
                      href: http://appdirect/api/account/v1/companies/7ee20d50-8147-482e-839c-775c02e73c45
                    user:
                      id: 952105f7-ad15-4fa3-bdbf-f25736a0dc48
                      href: http://appdirect/api/account/v1/users/952105f7-ad15-4fa3-bdbf-f25736a0dc48
                    accountDisplay: '1111'
                    paymentMethod: CREDIT_CARD
                    billingAddress:
                      street1: 50 Grove St.
                      street2: 500 Grove St.
                      city: Somerville
                      state: Massachusetts
                      zip: '02114'
                      country: US
                      firstName: John
                      lastName: Doe
                      companyName: AppDirect
                      phone: '9999999999'
                    creditCard:
                      name: John Doe
                      expirationMonth: 12
                      expirationYear: 2016
                      type: VISA
                      number: '12655615611'
                      securityCode: '111'
                    createdOn: 1481002402567
                    default: false
            application/xml:
              schema:
                description: OK
                type: array
                items:
                  $ref: '#/components/schemas/PaymentInstrumentWS'
        '404':
          description: Not Found
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request GET \\\n  --url https://marketplace.appdirect.com/api/billing/v1/companies/%7BcompanyId%7D/users/%7BuserId%7D/paymentInstruments"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://marketplace.appdirect.com/api/billing/v1/companies/%7BcompanyId%7D/users/%7BuserId%7D/paymentInstruments'\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/billing/v1/companies/%7BcompanyId%7D/users/%7BuserId%7D/paymentInstruments\")\n  .get()\n  .build();\n\nResponse response = client.newCall(request).execute();"
    post:
