      parameters:
      - description: Subscription ID
        name: subscriptionId
        in: path
        required: true
        schema:
          type: string
      - description: Number of results to fetch. Used for paging.
        name: count
        in: query
        schema:
          type: integer
          default: 250
      - description: Exclude invoices with no charges (free)
