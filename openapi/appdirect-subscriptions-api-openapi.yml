                          blockContractDecrease: false
                          blockContractIncrease: false
                          blockOriginalContractDecrease: false
                          amount:
                            USD: 10
                          pricingStrategy: UNIT
                        discount: null
                        primaryPrice: false
                      contract: null
                      previousOrder: null
                      nextOrder: null
                      discount: null
                      paymentPlanId: 24
                      discountId: null
                      activated: false
                      oneTimeOrders: []
                      orderLines: []
                      parameters: []
                      links:
                      - rel: subscription
                        href: http://appdirect/api/billing/v1/subscriptions/5096ed99-675b-449a-926e-0ee2c0aa4128
