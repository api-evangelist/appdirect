    get:
      description: List all of the subscriptions for the given user
      tags:
      - Subscriptions
      summary: List all subscriptions for a user
      operationId: resource_Other_readUserSubscriptions_GET
      parameters:
      - description: User's company ID
        name: companyId
        in: path
        required: true
        schema:
          type: string
      - description: User ID
        name: userId
        in: path
        required: true
        schema:
          type: string
      - description: Filters results to only include subscriptions that were created on or after the specified date in yyyy/MM/DD HH:mm:ss format
        name: fromDate
        in: query
        schema:
          type: string
      - description: Filters results to only include subscriptions that were created on or before the specified date in yyyy/MM/DD HH:mm:ss format
        name: toDate
        in: query
        schema:
          type: string
      - description: Filters subscriptions by internal discount ID
        name: discountId
        in: query
        schema:
          type: number
      - description: Filters subscriptions by order status
        name: status
        in: query
        schema:
          type: string
          items:
            enum:
            - INITIALIZED
            - FAILED
            - FREE_TRIAL
            - FREE_TRIAL_EXPIRED
            - ACTIVE
            - SUSPENDED
            - CANCELLED
            type: string
      - description: Filters subscriptions by internal edition ID
        name: editionId
        in: query
        schema:
          type: number
      - description: Filters subscriptions by internal payment plan ID
        name: paymentPlanId
        in: query
        schema:
          type: number
      - description: Filters subscriptions by last modified date
        name: lastModified
        in: query
        schema:
          type: number
      - description: Filters subscriptions by internal application ID
        name: applicationIds
        in: query
        schema:
          type: number
      - description: Filters subscriptions by internal bundle ID
        name: bundleApplicationId
        in: query
        schema:
          type: number
      - description: Expands filtered subscription results to include details about the specified query parameters, one or more of "order", "product", or "edition".
        name: expand
        in: query
        schema:
          type: string
      - description: Filters subscriptions by order reference code
        name: orderReferenceCode
        in: query
        schema:
          type: string
      - description: Number of results to fetch. Used for paging.
        name: count
        in: query
        schema:
          type: integer
          default: 250
      - description: Sort field
        name: sortField
        in: query
        schema:
          type: string
          enum:
          - APPLICATION
          - COMPANY
          - DATE
          - OWNER
          - STATUS
          - SUBSCRIPTION_ID
          default: DATE
      - description: Sort order
        name: sortOrder
        in: query
        schema:
          type: string
          enum:
          - ASC
          - DESC
          default: ASC
