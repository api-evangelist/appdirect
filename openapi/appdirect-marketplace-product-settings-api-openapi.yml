components:
  schemas:
    FreeTrialEditionWS:
      type: object
      description: These settings impact the billing information and conversion requirements for free trials.
      title: FreeTrialEdition
      properties:
        editionId:
          description: Unique ID of the edition.
          type: integer
        editionName:
          description: Name of the edition.
          type: string
        requireBillingInfo:
          description: Indicates whether billing address and payment method is required for purchasing this edition.
          type: boolean
        automaticUpgradeToPaidEnabled:
          description: Indicates whether free trial was automatically upgraded to a paid edition.
          type: boolean
      example:
        editionId: 9890
        editionName: Free Trial
        requireBillingInfo: true
        automaticUpgradeToPaidEnabled: true
    MerchandisingRibbonSelectionWS:
