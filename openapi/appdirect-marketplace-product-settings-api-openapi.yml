        hideAllPricing:
          description: Indicates whether all pricing information on the marketplace, including the pricing tab on the product profile page, is hidden.
          type: boolean
        disableSelfServe:
          description: Indicates whether a customer can perform purchases, upgrades, and cancellations of the product without sales representative or reseller assistance.
          type: boolean
        termsOfServiceURL:
          description: Terms of service URL
          type: string
        collectLeads:
          $ref: '#/components/schemas/CollectLeadsWS'
        sortingRank:
          $ref: '#/components/schemas/SortingRankWS'
      example:
        validations:
        - field: termsOfServiceURL
          maxLength: 1024
        visibleOnNetwork: true
        visibleOnMarketplace: true
        sellDomainAsStandalone: true
        showAsComingSoon: true
        collectLeads:
          options:
          - inAdditionToPurchase
          - insteadOfPurchase
          enabled: true
          selectedOption: inAdditionToPurchase
          assignLeadsToDevelopers: false
          editionLeadGenEnabled: false
        hideAllPricing: true
        disableSelfServe: true
        termsOfServiceURL: http://www.google.com
        sortingRank:
          selectedOption: Very Low
          options:
          - Very High
          - High
          - Medium
          - Low
          - Very Low
    BillingCycleStartDayOption:
      description: Billing cycle start day options.
      type: string
      title: BillingCycleStartDayOption
      enum:
      - MP_DEFAULT_CYCLE
      - FIRST_DAY_OF_THE_MONTH
      - LAST_DAY_OF_THE_MONTH
      - PURCHASE_DAY
      - CUSTOM_DAY_OF_THE_MONTH
    SkuWS:
      type: object
      description: Information about SKUs associated with a payment plan for the edition.
      title: Sku
      properties:
        pricingItemId:
          description: Unique ID of the SKU pricing item.
          type: integer
        price:
          description: Price of the SKU item.
          type: string
        sku:
          description: Description of the SKU pricing item.
          type: string
        fid1:
          description: Fid1 of the SKU pricing item.
          type: string
      example:
        pricingItemId: 20423
        price: $0.03
        sku: A1B2C3
        fid1: yyyy-yyyyyy-yyyy
    AdditionalSettingsWS:
      type: object
      description: Information about additional settings for a product.
      title: AdditionalSettings
      properties:
        validations:
          type: array
          description: Information about the validation applied to a setting.
          items:
            $ref: '#/components/schemas/SettingValidationWS'
        customSettings:
          type: array
          description: Details of the custom settings for the product.
          items:
            $ref: '#/components/schemas/CustomSettingWS'
      example:
        validations:
        - field: externalIdentifier
          maxLength: 36
        - field: productStockNumber
          maxLength: 36
    GeneralSettingsWS:
      type: object
      description: Information about the availability of the product, API health maintenance, and additional settings.
      title: GeneralSettings
      properties:
        settings:
          $ref: '#/components/schemas/AvailabilitySettingsWS'
        apiHealthMaintenance:
          $ref: '#/components/schemas/ApiHealthMaintenanceSettingsWS'
        additionalSettings:
          $ref: '#/components/schemas/AdditionalSettingsWS'
      example:
        settings:
          validations:
          - field: termsOfServiceURL
            maxLength: 1024
          visibleOnNetwork: true
          visibleOnMarketplace: true
          sellDomainAsStandalone: true
          showAsComingSoon: true
          collectLeads:
            options:
            - inAdditionToPurchase
            - insteadOfPurchase
            enabled: true
            selectedOption: inAdditionToPurchase
            assignLeadsToDevelopers: false
            editionLeadGenEnabled: false
          hideAllPricing: true
          disableSelfServe: true
          termsOfServiceURL: http://www.google.com
          sortingRank:
            selectedOption: Very Low
            options:
            - Very High
            - High
            - Medium
            - Low
            - Very Low
        additionalSettings:
          validations:
          - field: externalIdentifier
            maxLength: 36
          - field: productStockNumber
            maxLength: 36
        apiHealthMaintenance:
          purchase:
            value: true
            disabled: false
          singleSignOn:
            value: false
            disabled: false
          updateSubscription:
            value: true
            disabled: true
            tooltip: The product is part of a bundle.
          assignAndUnassign:
            value: false
            disabled: true
            tooltip: This endpoint has been disabled by the developer.
    CustomSettingWS:
      type: object
      description: Details of the custom settings for the product. The custom setting value can be string or boolean.
      title: CustomSetting
      properties:
        key:
          description: The custom settings ID.
          type: string
        value:
          description: The custom settings value.
          type: object
        label:
          description: The custom settings label.
          type: string
    Segments:
      description: A characteristic shared by segment group members
      title: Segments
      type: object
      properties:
        id:
          description: Segment ID
          type: string
        name:
          description: Segment name
          type: string
          minLength: 1
          maxLength: 255
      example:
        id: 04f8d043-10f1-4b89-8c0e-0780e5a62298
        name: iOS users
