openapi: 3.0.0
info:
  description: The Companies API allows developers to manage marketplace companies and their user memberships.
  title: Companies AI Embed Edition API
  license:
    name: Apache License, Version 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  version: v296.0-SNAPSHOT
servers:
- url: https://marketplace.appdirect.com/api
- url: https://virtserver.swaggerhub.com
tags:
- name: Edition
  x-displayName: Editions
paths:
  /marketplace/v1/products/{applicationId}/editions/{editionId}:
    get:
      description: This call returns all details related to a specific product edition
      tags:
      - Edition
      summary: Retrieve an edition
      operationId: resource_Edition_readEdition_GET
      parameters:
      - description: product id
        name: applicationId
        in: path
        required: true
        schema:
          type: number
      - description: Edition id
        name: editionId
        in: path
        required: true
        schema:
          type: number
      responses:
        '200':
          description: Edition information returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditionWS'
              examples:
                response:
                  value:
                    id: 316
                    uuid: 77395548-5c87-45d0-9c87-4fc51ea8aa97
                    rank: 1
                    name: XLt6HgwZBq
                    primary: false
                    trial:
                      length: 1
                      unit: MONTH
                    expiredTrialGracePeriod: null
                    bundleOnly: false
                    targetAudience: null
                    code: WfvHz
                    defaultFreeTrial: false
                    invisible: false
                    leadGen: false
                    lastModified: 1461792763091
                    revenueType: RECURRING
                    restricted: false
                    freeTrialDuration: 1
                    freeTrialType: MONTH
                    customerContractRestricted: false
                    plans:
                    - href: http://localhost/api/marketplace/v1/products/316/editions/316/paymentPlans/624
                      id: 624
                      uuid: 9d813cc8-4aa8-4b22-b6ff-bfb4d8a72426
                      frequency: MONTHLY
                      contract:
                        minimumServiceLength: 3
                        cancellationPeriodLimit: null
                        endOfContractGracePeriod: null
                        blockSwitchToShorterContract: false
                        blockContractDowngrades: false
                        blockContractUpgrades: false
                        gracePeriod: null
                        terminationFee: null
                        autoExtensionPricingId: 624
                      allowCustomUsage: false
                      keepBillDateOnUsageChange: false
                      separatePrepaid: false
                      isPrimaryPrice: false
                      costs:
                      - unit: USER
                        unitDependency: null
                        minUnits: 0
                        maxUnits: null
                        meteredUsage: false
                        increment: 1
                        pricePerIncrement: false
                        blockContractDecrease: false
                        blockContractIncrease: false
                        blockOriginalContractDecrease: false
                        amount:
                          USD: 10
                      discount: null
                      primaryPrice: false
                    - href: http://localhost/api/marketplace/v1/products/316/editions/316/paymentPlans/625
                      id: 625
                      uuid: f55ad8a6-11d4-4bab-ac7f-d1bf887e685d
                      frequency: MONTHLY
                      contract:
                        minimumServiceLength: 6
                        cancellationPeriodLimit: null
                        endOfContractGracePeriod: null
                        blockSwitchToShorterContract: false
                        blockContractDowngrades: false
                        blockContractUpgrades: false
                        gracePeriod: null
                        terminationFee: null
                        autoExtensionPricingId: 625
                      allowCustomUsage: false
                      keepBillDateOnUsageChange: false
                      separatePrepaid: false
                      isPrimaryPrice: false
                      costs:
                      - unit: USER
                        unitDependency: null
                        minUnits: 0
                        maxUnits: null
                        meteredUsage: false
                        increment: 1
                        pricePerIncrement: false
                        blockContractDecrease: false
                        blockContractIncrease: false
                        blockOriginalContractDecrease: false
