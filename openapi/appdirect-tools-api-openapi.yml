    post:
      tags:
      - Tools
      summary: Create an MCP server tool
      description: Creates an MCP server tool and associates it with the AI.
      operationId: createMcpServerTool
      parameters:
      - name: aiId
        in: path
        required: true
        description: The identifier of the AI.
        schema:
