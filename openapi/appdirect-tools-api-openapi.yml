  /api/v1/ai/{aiId}/tools/auth:
    get:
      tags:
      - Tools
      summary: List tool OAuth status for the AI
      description: Lists OAuth token status information for tools associated with the AI.
      operationId: listAIToolAuthStatus
      parameters:
      - name: aiId
        in: path
        required: true
        description: The identifier of the AI.
        schema:
          type: string
      responses:
        '200':
          description: Tool OAuth status list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolAuthInfo'
      security:
      - ApiKeyAuth: []
  /api/v1/ai/{aiId}/tools/auth/reset:
    put:
      tags:
      - Tools
      summary: Reset tool OAuth tokens for the AI
      description: Deletes tool OAuth tokens for the AI.
      operationId: resetAIToolAuth
      parameters:
      - name: aiId
        in: path
        required: true
        description: The identifier of the AI.
        schema:
          type: string
      responses:
        '200':
          description: OAuth tokens deleted.
          content:
            application/json:
              schema:
                type: string
      security:
      - ApiKeyAuth: []
  /api/v1/tools/{toolId}:
    get:
      tags:
      - Tools
      summary: Get a tool
      description: Retrieves a tool by ID.
      operationId: getTool
      parameters:
      - name: toolId
        in: path
        required: true
        description: The identifier of the tool.
        schema:
          type: string
      responses:
        '200':
          description: Tool details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        '403':
          description: Forbidden, the user is not authorized to perform this action.
        '404':
          description: Tool not found.
      security:
      - ApiKeyAuth: []
    delete:
      tags:
      - Tools
      summary: Delete a tool
      description: Deletes the specified tool.
      operationId: deleteTool
      parameters:
      - name: toolId
        in: path
        required: true
        description: The identifier of the tool.
        schema:
          type: string
      responses:
        '204':
          description: Tool deleted.
        '403':
          description: Forbidden, the user is not authorized to perform this action.
      security:
      - ApiKeyAuth: []
  /api/v1/tools/{toolId}/sql:
    put:
      tags:
      - Tools
      summary: Update a SQL tool
      description: Updates the SQL tool configuration.
      operationId: updateSqlTool
      parameters:
      - name: toolId
        in: path
        required: true
        description: The identifier of the tool.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSQLToolRequest'
      responses:
        '200':
          description: Tool updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
      security:
      - ApiKeyAuth: []
  /api/v1/tools/{toolId}/user-input:
    put:
      tags:
      - Tools
      summary: Update a user input tool
      description: Updates the user input tool configuration.
      operationId: updateUserInputTool
      parameters:
      - name: toolId
        in: path
        required: true
        description: The identifier of the tool.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInputToolRequest'
      responses:
        '200':
          description: Tool updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
      security:
      - ApiKeyAuth: []
  /api/v1/tools/{toolId}/knowledge-retrieval:
    put:
      tags:
      - Tools
      summary: Update a knowledge retrieval tool
      description: Updates the knowledge retrieval tool configuration.
      operationId: updateKnowledgeRetrievalTool
      parameters:
      - name: toolId
        in: path
        required: true
        description: The identifier of the tool.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeRetrievalToolRequest'
      responses:
        '200':
          description: Tool updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
      security:
      - ApiKeyAuth: []
  /api/v1/tools/{toolId}/image-generation:
    put:
      tags:
      - Tools
      summary: Update an image generation tool
      description: Updates the image generation tool configuration.
      operationId: updateImageGenerationTool
      parameters:
      - name: toolId
        in: path
        required: true
        description: The identifier of the tool.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateImageGenerationToolRequest'
      responses:
        '200':
          description: Tool updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
      security:
      - ApiKeyAuth: []
  /api/v1/tools/{toolId}/mcp:
    put:
      tags:
      - Tools
      summary: Update an MCP server tool
      description: Updates the MCP server tool configuration.
      operationId: updateMcpServerTool
      parameters:
      - name: toolId
        in: path
        required: true
        description: The identifier of the tool.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMcpServerToolRequest'
      responses:
        '200':
          description: Tool updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
      security:
      - ApiKeyAuth: []
  /api/v1/tools/{toolId}/api-function:
    put:
      tags:
      - Tools
      summary: Update an API function tool
      description: Updates the API function tool configuration.
      operationId: updateApiFunctionToolGlobal
      parameters:
      - name: toolId
        in: path
        required: true
        description: The identifier of the tool.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiToolRequest'
      responses:
        '200':
          description: Tool updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
      security:
      - ApiKeyAuth: []
  /api/v1/tools/{toolId}/api-function/callback:
    get:
      tags:
      - Tools
      summary: API function tool OAuth callback
      description: Handles OAuth callbacks for API function tools.
      operationId: apiFunctionToolCallback
      parameters:
      - name: toolId
        in: path
        required: true
        description: The identifier of the tool.
        schema:
          type: string
      - name: code
        in: query
        required: true
        description: Authorization code.
        schema:
          type: string
      responses:
        '200':
          description: Callback handled.
          content:
            application/json:
              schema:
                type: string
      security:
      - ApiKeyAuth: []
  /api/v1/tools/{toolId}/oauth-status:
    get:
      tags:
      - Tools
      summary: Get tool OAuth status
      description: Checks whether a tool has an active OAuth token.
      operationId: getToolOAuthStatus
      parameters:
      - name: toolId
        in: path
        required: true
        description: The identifier of the tool.
        schema:
          type: string
      responses:
        '200':
          description: OAuth status for the tool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOAuthStatus'
      security:
      - ApiKeyAuth: []
  /api/v1/tools/{toolId}/oauth-token:
    delete:
      tags:
      - Tools
      summary: Delete a tool OAuth token
      description: Revokes the OAuth token for the specified tool.
      operationId: deleteToolOAuthToken
      parameters:
      - name: toolId
        in: path
        required: true
        description: The identifier of the tool.
        schema:
          type: string
      responses:
        '204':
          description: Token deleted.
      security:
      - ApiKeyAuth: []
  /api/v1/tools/{toolId}/oauth-initiate:
    post:
      tags:
      - Tools
      summary: Initiate tool OAuth flow
      description: Generates an authorization URL for tool OAuth.
      operationId: initiateToolOAuth
      parameters:
      - name: toolId
        in: path
        required: true
        description: The identifier of the tool.
        schema:
          type: string
      responses:
        '200':
          description: Authorization URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthInitiateResponse'
      security:
      - ApiKeyAuth: []
  /api/v1/tools/mcp/preview:
    post:
      tags:
      - Tools
      summary: Preview MCP server tools
      description: Previews available tools from an MCP server or template.
      operationId: previewMcpServerTools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewMcpServerToolRequest'
      responses:
        '200':
          description: Preview results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewMcpServerToolResponse'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    UpdateKnowledgeRetrievalToolRequest:
      allOf:
      - $ref: '#/components/schemas/CreateKnowledgeRetrievalToolRequest'
    PreviewMcpServerToolRequest:
      type: object
      properties:
        url:
          type: string
        orgToolTemplateId:
          type: string
        toolTemplateId:
          type: string
        toolId:
          type: string
        authenticationType:
          $ref: '#/components/schemas/AuthenticationType'
        authenticationData:
          oneOf:
          - $ref: '#/components/schemas/ApiKeyAuthenticationData'
          - $ref: '#/components/schemas/OAuthAuthenticationData'
    ToolListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
    CreateMcpServerToolRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - MCP_SERVER
        name:
          type: string
        url:
          type: string
        orgToolTemplateId:
          type: string
        authenticationType:
          $ref: '#/components/schemas/AuthenticationType'
        authenticationData:
          oneOf:
          - $ref: '#/components/schemas/ApiKeyAuthenticationData'
          - $ref: '#/components/schemas/OAuthAuthenticationData'
        allTools:
          type: array
          items:
            $ref: '#/components/schemas/MCPTool'
        selectedTools:
          type: array
          items:
            type: string
      required:
      - type
      - name
    PreviewMcpServerToolResponse:
      type: object
      properties:
        availableTools:
          type: array
          items:
            $ref: '#/components/schemas/MCPTool'
        authenticationRequired:
          type: boolean
        oauthDiscovery:
          type: object
        requiresToolSave:
          type: boolean
    ApiCompressionConfiguration:
      type: object
      properties:
        compressionModel:
          type: string
        compressionThreshold:
