      - Tools
      summary: List MCP server tools for the AI
      description: Retrieves MCP server tools associated with the AI.
      operationId: listMcpServerTools
      parameters:
      - name: aiId
        in: path
        required: true
        description: The identifier of the AI.
        schema:
