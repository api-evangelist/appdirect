openapi: 3.2.0
info:
  title: Devs.ai Categories API
  version: '1.0'
security: []
tags:
- name: Categories
paths:
  /api/v1/categories:
    get:
      tags:
      - Categories
      summary: List tenant categories
      description: Retrieves available tenant categories for AI assignment.
      operationId: listTenantCategories
      parameters:
      - name: orgId
        in: query
        required: false
        description: Optional org ID for superusers.
        schema:
          type: string
      responses:
        '200':
          description: List of tenant categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantCategory'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    TenantCategory:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: integer
        name:
          type: string
        description:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        parentCategoryId:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Enter your bearer token in the format **Bearer {token}**. Legacy header X-Authorization is also supported for backwards compatibility.
