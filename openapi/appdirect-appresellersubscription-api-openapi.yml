    AppResellerSubscriptionLightWS:
      type: object
      title: AppResellerSubscriptionLightWS
      required:
      - id
      - activeOrder
      - company
      - user
      - applicationName
      - status
      properties:
        id:
          description: Subscription ID
          type: string
        activeOrder:
