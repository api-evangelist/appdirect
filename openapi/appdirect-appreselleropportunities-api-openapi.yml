    post:
      x-appdirect-api-stage: Early Access
      summary: Required field definitions
      description: 'For a customer/sales agent combination, returns the vendor-required fields for one or more products, and a description of the fields. Request can be made before or after an opportunity is created. It returns the fields that will be required, and any values previously saved on the AppDirect platform that can be prepopulated when an opportunity is created. It does not return required field values edited, added, or saved with an opportunity.


        Some vendors (for example, Microsoft) have business rules that exclude required fields from the response when the vendor already has the information stored on their platform for the customer/sales agent/product combination.


        Required: Accept-Language header with Locale format. For example: en-US'
      tags:
      - AppResellerOpportunities
      operationId: getRequiredFieldsDefinitions
      x-appdirect-required-scopes:
        ROLE_RESELLER:
