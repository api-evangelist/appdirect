    ContractConfiguration:
      type: object
      title: ContractConfiguration
      description: 'Contract configuration options for subscriptions that customers purchase. For example: contract length and cancellation penalities.'
      properties:
        minimumServiceLength:
          type: integer
          description: Contract length. The number of minimumServiceLengthUnits that defines contract duration.
        minimumServiceLengthUnit:
          $ref: '#/components/schemas/MinimumServiceLengthUnit'
        renewalConfiguration:
          $ref: '#/components/schemas/RenewalConfiguration'
        terminationFee:
          $ref: '#/components/schemas/TerminationFeeAS'
        terminationFeeGracePeriod:
          type: integer
          description: Termination fee grace period duration. Number of terminationFeeGracePeriodUnits that define the risk-free period after the contract starts, during which no termination fee is charged if the customer cancels the contract.
        terminationFeeGracePeriodUnit:
          $ref: '#/components/schemas/TerminationFeeGracePeriodUnit'
        endOfContractGracePeriod:
          type: integer
          description: End of contract grace period duration. Number of endofContractGracePeriodUnits that define the period after the contract ends, during which customers can resubscribe before their account and data might be deleted.
        endOfContractGracePeriodUnit:
          $ref: '#/components/schemas/GracePeriodUnit'
        contractCancellationPeriodLimit:
          type: integer
          description: Contract cancellation period limit duration. Number of contractCancellationPeriodUnits that define the period before the contract ends, during which customers can no longer cancel the contract and it is renewed.
        contractCancellationPeriodUnit:
          $ref: '#/components/schemas/CancellationPeriodUnit'
        unitTerms:
          description: Maps a unit type (for example, user) to UnitContractTerms (see object definition). Enabled terms restrict mid-contract quantity changes for the unit type on subscriptions. See example.
          type: object
          properties:
            default:
              type: string
          additionalProperties:
            $ref: '#/components/schemas/UnitContractTerms'
        blockContractUpgrades:
          description: Whether subscriptions can be upgraded mid-contract term
          type: boolean
          default: false
        blockContractDowngrades:
          description: Whether subscriptions can be downgraded mid-contract term
          type: boolean
          default: false
        blockSwitchToShorterContract:
          description: Whether subscriptions can be changed to plans with shorter or no contracts.
          type: boolean
          default: false
        keepContractDateOnPlanChange:
          description: Whether the remaining contract duration changes when a user changes a subscription pricing plan
          type: boolean
          default: false
        isDefault:
          description: Whether it is a default or custom contract
          type: boolean
          default: false
      example:
        minimumServiceLength: '24'
        minimumServiceLengthUnit: MONTHLY
        terminationFee:
          feeType: FIXED
          amount: '2'
        renewalConfiguration: MONTH_TO_MONTH
        terminationFeeGracePeriod: '7'
        terminationFeeGracePeriodUnit: DAY
        contractCancellationPeriodLimit: null
        contractCancellationPeriodUnit: NONE
        endOfContractGracePeriod: null
        endOfContractGracePeriodUnit: INFINITY
        unitTerms:
          USER:
            blockContractIncrease: false
            blockOriginalContractDecrease: false
            blockContractDecrease: true
        blockContractUpgrades: false
        blockContractDowngrades: true
        blockSwitchToShorterContract: true
        keepContractDateOnPlanChange: false
    Company:
      type: object
      title: Company
