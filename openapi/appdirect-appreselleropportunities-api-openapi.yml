          type: integer
          description: HTTP status code
        code:
          $ref: '#/components/schemas/OpportunityErrorCode'
        message:
          type: string
          description: Descriptive error message for debugging
        details:
          type: array
          description: Additional error details
          items:
            $ref: '#/components/schemas/OpportunityErrorDetails'
      example:
        status: 503
        code: SERVICE_UNAVAILABLE
        message: Unable to reach the service, please contact support@appdirect.com
    OpportunityCurrency:
      type: string
      title: OpportunityCurrency
      description: The currency using the ISO-4217 currency code
      pattern: ^[A-Z]{3}$
      enum:
      - USD
      - CAD
      - EUR
      - JPY
      - GBP
      - KRW
      - CHF
      - SEK
      - SGD
      - MYR
      - AUD
      - MXN
      - INR
      - BRL
      - DKK
      - NZD
      - NOK
      - ZAR
      - PHP
      - CNY
      - SAR
      - GTQ
      - IDR
      - ARS
      - COP
      - PEN
      default: USD
      example: USD
    ProductIds:
      type: object
      title: ProductIds
      description: A product ID and edition code
      required:
      - productId
      - editionId
      properties:
        productId:
          type: string
          description: The product ID
        editionId:
          type: string
          description: The edition code
      example:
        productId: dfc9cefb-610b-4e49-ade8-6ae51a4d35c9
        editionId: EDITION_CODE
    CancellationPeriodUnit:
      type: string
      title: CancellationPeriodUnit
      description: Cancellation period unit. Time unit by which the contractCancellationPeriodLimit is measured.
      enum:
      - NONE
      - DAY
      example: NONE
    FeeType:
      type: string
      title: FeeType
      description: Contract termination fee type
      enum:
      - NONE
      - PERCENTAGE
      - FIXED
      example: FIXED
    MinimumServiceLengthUnit:
      type: string
      title: MinimumServiceLengthUnit
      description: Time unit for contract length. This property must have the same value as the contract length unit configured for the pricing plan.
      enum:
      - DAILY
      - MONTHLY
      - QUARTERLY
      - SIX_MONTHS
      - YEARLY
      - TWO_YEARS
      - THREE_YEARS
      example: MONTHLY
    TotalRecurring:
      type: object
      title: TotalRecurring
      description: Represent recurring fee of a specfic billing cycle
      properties:
        totalSalePrice:
          type: string
          description: The total sale price
        totalWholeSalePrice:
          type: string
          description: The total wholesale price
        nextInvoiceDate:
          type: string
          description: Date for the next invoice
        billingCycle:
          $ref: '#/components/schemas/BillingCycle'
      example:
        billingCycle:
          period: YEARLY
          dayOfMonth: 17
        totalSalePrice: '240.0000000000'
  parameters:
    OpportunityStatus:
      in: query
      name: status
      description: Opportunity status
      required: false
      schema:
        type: string
        enum:
        - OPEN
        - CLOSED
        - PENDING_REVIEW
