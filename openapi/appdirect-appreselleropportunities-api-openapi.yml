  /assistedSales/v2/opportunities/{opportunityId}/applyDiscount:
    post:
      x-appdirect-api-stage: Early Access
      summary: Apply discount
      description: 'Apply a discount to an opportunity. More than one discount (one per call) can be applied to an opportunity. The response is an updated opportunity summary.

        The discount is applied to all eligible products. However, redemption limits apply. When the redemption limits exceed the contents of the opportunity, the discount is not applied.


        Required: Accept-Language header with Locale format. For example: en-US'
      tags:
      - AppResellerOpportunities
      operationId: applyDiscount
      x-appdirect-required-scopes:
        ROLE_RESELLER:
        - Allows access as a Reseller to the opportunity
        ROLE_SALES_SUPPORT:
        - Allows access as Sales Support to the opportunity
        ROLE_CHANNEL_ADMIN:
        - Allows access as a Marketplace Manager to the opportunity
        ROLE_RESELLER_MANAGER:
        - Allows access as a Reseller Manager to the opportunity
        ROLE_PARTNER:
        - Allows access as a Partner to the opportunity
      parameters:
      - name: opportunityId
        in: path
        description: Opportunity ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountRequest'
        description: The discount to be applied
        required: true
      responses:
        '200':
          description: The discount was applied and the request returned an updated opportunity summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunitySummary'
              examples:
                response:
                  value:
                    amountDueBeforeTax: '-8.0000000000'
                    taxSummary: []
                    amountDueAfterTax: '-8.0000000000'
                    items:
                    - id: ea1e0548-888b-402a-8cbc-1e3c6754a2bd
