      example: ONE_TIME
    UnitDefinition:
      type: object
      title: UnitDefinition
      description: Configuration details for a unit type that is part of a pricing plan
      properties:
        unit:
          type: string
          description: Unit type name
        minimum:
          type: string
          description: The minimum number of units that users can buy
        maximum:
          type: string
          description: The maximum number of units that users can buy
        quantity:
          type: string
          description: Purchase quantity
        meteredUsage:
          type: boolean
          description: If true, this unit must be configured for metered usage
        allowDecimals:
          type: boolean
          description: If true, this unit can be purchased in decimal (fractional) quantities
        readOnly:
          type: boolean
          description: If true, the user cannot set a quantity for this unit at the time of purchase
        pricePerIncrement:
          type: boolean
          description: If true, the price per increment is displayed. For example, if the unit has a unit price is $1 and users must purchase in increments of 5, the price appears as $5 for 5 units.
        increment:
          type: number
          description: Restrict users to purchasing the unit in this number of increments. For example, require users to purchase the unit type in increments of 5.
      example:
      - unit: USER
        minimum: '1.0000000000'
        meteredUsage: false
        allowDecimals: false
        readOnly: false
        quantity: '1.0000000000'
        increment: 1
        pricePerIncrement: false
    ProvisioningConfiguration:
      type: object
