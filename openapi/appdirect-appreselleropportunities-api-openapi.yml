                response:
                  value:
                    status: 400
                    code: INVALID_PAYLOAD_ERROR
                    message: Either the discount code is invalid or one of the required parameters is missing or invalid
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityError'
              examples:
                response:
                  value:
                    status: 401
                    code: UNAUTHORIZED
                    message: HTTP 401 Unauthorized
        '403':
          description: The user does not have access to the opportunity or have the permission to execute the action, or the opportunity status does not allow the action
