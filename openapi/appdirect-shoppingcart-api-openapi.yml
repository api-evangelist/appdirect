openapi: 3.0.0
info:
  description: The Companies API allows developers to manage marketplace companies and their user memberships.
  title: Companies AI Embed ShoppingCart API
  license:
    name: Apache License, Version 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  version: v296.0-SNAPSHOT
servers:
- url: https://marketplace.appdirect.com/api
- url: https://virtserver.swaggerhub.com
tags:
- name: ShoppingCart
  description: Operations related to shopping carts
  x-displayName: ShoppingCart
paths:
  /v3/checkout/shoppingCarts:
    get:
      tags:
      - ShoppingCart
      x-appdirect-api-stage: Early Access
      x-appdirect-visible: false
      summary: List shopping carts
      description: Returns all ACTIVE and FINISHED shopping carts
      operationId: listShoppingCarts
      parameters:
      - in: query
        name: buyerUserId
        description: Buyer user ID
        schema:
          type: string
      - in: query
        name: buyerCompanyId
        description: Buyer user company ID
        schema:
          type: string
      - in: query
        name: ownerUserId
        description: Owner user ID
        schema:
          type: string
      - in: query
        name: ownerCompanyId
        description: Owner company ID
        schema:
          type: string
      - in: query
        name: productId
        description: Product ID
        schema:
          type: string
      - in: query
        name: status
        description: Shopping cart status
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: partner
        description: Shopping cart partner (This field is not public to client)
        schema:
          type: string
      - in: query
        name: number
        description: 1-based page index
        schema:
          type: integer
          default: 1
      - in: query
        name: size
        description: The number of results per page to return
        schema:
          type: integer
          default: 10
      - in: query
        name: sortField
        description: Sort field
        schema:
          type: string
          default: createdOn
      - in: query
        name: sortOrder
        description: Sort order.
        schema:
          type: string
          enum:
          - ASC
          - DESC
          default: ASC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResources'
              examples:
                response:
                  value:
                    content:
