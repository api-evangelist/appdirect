        source: "OkHttpClient client = new OkHttpClient();\n\nMediaType mediaType = MediaType.parse(\"application/json\");\nRequestBody body = RequestBody.create(mediaType, \"{\\\"accreditedAgents\\\":[{\\\"userId\\\":\\\"83407ce8-373f-11e6-ac61-9e71128cae77\\\",\\\"companyId\\\":\\\"a411dc54-d46f-4002-ab00-3ea52e4eb118\\\"}]}\");\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/v3/checkout/shoppingCarts/%7BshoppingCartId%7D/accreditedAgents\")\n  .put(body)\n  .addHeader(\"content-type\", \"application/json\")\n  .addHeader(\"AD-ShoppingCart-Partner\", \"SOME_STRING_VALUE\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
    delete:
      tags:
      - ShoppingCart
      x-appdirect-api-stage: Early Access
      x-appdirect-visible: false
      summary: Remove accredited agents
      operationId: deleteShoppingCartAccreditedAgents
      parameters:
      - $ref: '#/components/parameters/shoppingCartId'
      - in: header
        name: AD-ShoppingCart-Partner
        required: true
        description: The partner code of a marketplace
        schema:
          type: string
      description: Removes the accredited agent from the specified cart
      responses:
        '204':
          description: NO CONTENT
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request DELETE \\\n  --url https://marketplace.appdirect.com/api/v3/checkout/shoppingCarts/%7BshoppingCartId%7D/accreditedAgents \\\n  --header 'AD-ShoppingCart-Partner: SOME_STRING_VALUE'"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'DELETE',\n  url: 'https://marketplace.appdirect.com/api/v3/checkout/shoppingCarts/%7BshoppingCartId%7D/accreditedAgents',\n  headers: {'AD-ShoppingCart-Partner': 'SOME_STRING_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/v3/checkout/shoppingCarts/%7BshoppingCartId%7D/accreditedAgents\")\n  .delete(null)\n  .addHeader(\"AD-ShoppingCart-Partner\", \"SOME_STRING_VALUE\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
  /v3/checkout/shoppingCarts/notifyLockedCarts:
    post:
      tags:
      - ShoppingCart
      x-appdirect-api-stage: Early Access
      x-appdirect-visible: false
      summary: Send locked cart notifications
      description: Finds all locked carts in ACTIVE status and sends approval request notifications for each one. Locked carts must be approved before they can be finalized.
      operationId: notifyLockedCarts
      parameters:
      - in: header
        name: AD-ShoppingCart-Partner
        description: The partner code of a marketplace
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request POST \\\n  --url https://marketplace.appdirect.com/api/v3/checkout/shoppingCarts/notifyLockedCarts \\\n  --header 'AD-ShoppingCart-Partner: SOME_STRING_VALUE'"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://marketplace.appdirect.com/api/v3/checkout/shoppingCarts/notifyLockedCarts',\n  headers: {'AD-ShoppingCart-Partner': 'SOME_STRING_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/v3/checkout/shoppingCarts/notifyLockedCarts\")\n  .post(null)\n  .addHeader(\"AD-ShoppingCart-Partner\", \"SOME_STRING_VALUE\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
components:
  schemas:
    ShoppingCartItem:
      type: object
      title: ShoppingCartItem
      description: Shopping cart item properties
      properties:
        id:
          type: string
          example: 45ae34b7-ffc1-4d74-be78-dce34008cd2e
          description: Item UUID
        referenceId:
          type: string
          example: '45'
          description: A 'local' ID for the item, which can be used in requests instead of the full UUID. Use the ref:{referenceId} format.
        subscriptionId:
          type: string
          example: 83407ce8-373f-11e6-ac61-9e71128cae77
          description: Existing subscription UUID.
        pricingPlanId:
          type: string
          example: 3dcc468d-fd4c-41ce-b700-f88c0c74561f
          description: ID of the pricing plan that the user is going to purchase
        serviceConfiguration:
          $ref: '#/components/schemas/ServiceConfiguration'
        billingConfiguration:
          $ref: '#/components/schemas/BillingConfiguration'
        discountCode:
          type: string
          example: DISCOUNT
          description: Discount applied to the product
        discountId:
          type: string
          example: '30'
          description: Discount ID
        customPrices:
          type: array
          description: Definition of custom prices for the purchase
          items:
            $ref: '#/components/schemas/CustomPrice'
        units:
          type: array
          description: List of units included in the product
          default: []
          items:
            $ref: '#/components/schemas/Unit'
        customAttributes:
          $ref: '#/components/schemas/ItemCustomAttributes'
        customContractConfiguration:
          $ref: '#/components/schemas/CustomContractConfiguration'
    Unit:
      type: object
      description: Purchase item unit
      title: Unit
      properties:
        quantity:
          type: number
          description: Quantity
        unit:
          type: string
          description: Unit
      example:
        quantity: '8'
        unit: USER
    ServiceStrategy:
      title: ServiceStrategy
      description: Service strategy. By default, the service is activated immediately. To set a custom activation date, specify CUSTOM.
      type: string
      enum:
      - CUSTOM
      - IMMEDIATELY
    PreAuthStatus:
      title: PreAuthStatus
      type: string
      enum:
      - SUCCESS
      - FAILURE
      - NOT_SUPPORTED
      - ERROR
      - PROCESSING
    GracePeriodUnit:
      type: string
      title: GracePeriodUnit
      description: End-of-contract grace period unit. Time unit by which the endOfContractGracePeriod is measured.
      enum:
      - NONE
      - INFINITY
      - DAY
      - MONTH
      example: INFINITY
    BillingConfiguration:
      type: object
      title: BillingConfiguration
      description: Determines when the billing cycle starts. Set UPON_SERVICE_ACTIVATION to start the billing cycle according to the specified provisioning strategy (either immediately after the opportunity is finalized or on a custom provisioning date). Set NEXT_BILLING_CYCLE to start the billing cycle according to the marketplace billing configuration (for example, first of the month). Set CUSTOM to start the billing cycle on a specified date in the future.
      properties:
        date:
          type: number
          description: Custom billing activation date in UNIX Epoch milliseconds. This date is required when the billing strategy is CUSTOM. Do not set the date when the strategy is UPON_SERVICE_ACTIVATION or NEXT_BILLING_CYCLE.
        strategy:
          $ref: '#/components/schemas/BillingStrategy'
      example:
        date: '1546300800000'
        strategy: CUSTOM
    TerminationFee:
      type: object
      title: TerminationFee
      description: Termination Fee object
      properties:
        feeType:
          $ref: '#/components/schemas/TerminationFeeType'
        amount:
          type: number
        description:
          type: string
    DeleteItemIds:
      title: DeleteItemIds
      type: object
      properties:
        ids:
          type: array
          description: Item IDs
          items:
            type: string
          example: '[]'
        cascade:
          type: array
          description: Cascade deletion of associated items
          items:
            $ref: '#/components/schemas/AssociationType'
          example: '["ADDON"]'
        itemPath:
          type: string
          description: Selection of items to delete, in JsonPath syntax
          example: .items[?(@.pricingPlanId=='planid')]
    Fee:
      type: object
      title: Fee
      description: The fee associated with a shopping cart
      properties:
        id:
          type: string
          description: Fee ID
          example: ce402858-4fe8-4254-8b69-73c41142f4ba
        externalId:
          type: string
          description: External ID assigned by the fee provider service
          example: a8bf31a8-fe75-4ab9-9559-dcd41eca9d12
        createdOn:
          type: string
          description: Fee creation date and time
          example: '2020-10-12 07:20:50.52Z'
        key:
          type: string
          description: Key used to identify fee type
          example: SHIPPING_FEE_100
        currency:
          type: string
          description: Currency code (ISO 4217) of the fee
          example: USD
        amount:
          type: number
          description: Fee amount
          example: '9.81'
        description:
          $ref: '#/components/schemas/Description'
        revenueShare:
          $ref: '#/components/schemas/RevenueShare'
        itemIds:
          type: array
          description: List of item IDs
          items:
            type: string
          example: '["b126e204-05f9-444a-af43-7629069eed03", "20de5578-a903-43da-95b8-65a3b584bc29", "a104ae19-d5cd-4de1-802b-5b2ec60e7fbf"]'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Metadata
          example: 'key1: "value1"'
    UnitContractTerms:
      type: object
      title: UnitContractTerms
      description: Contract terms that restrict mid-contract quantity changes on subscriptions. unitTerms maps UnitContractTerms to a unit type (for example, user); enabled terms prevent actions for the unit type.
      properties:
        blockContractIncrease:
          type: boolean
          default: false
        blockContractDecrease:
          type: boolean
          default: false
        blockOriginalContractDecrease:
          type: boolean
          default: false
      example:
        blockContractIncrease: false
        blockOriginalContractDecrease: false
        blockContractDecrease: true
    PagedResources:
      allOf:
      - $ref: '#/components/schemas/ResourceSupport'
      - title: PagedResources
        type: object
        properties:
          page:
            $ref: '#/components/schemas/PageMetadata'
    BillingStrategy:
      type: string
      title: BillingStrategy
      enum:
      - CUSTOM
      - NEXT_BILLING_CYCLE
      - UPON_SERVICE_ACTIVATION
      default: UPON_SERVICE_ACTIVATION
      example: CUSTOM
    Link:
      type: object
      title: Link
      properties:
        href:
          type: string
        rel:
          type: string
      example:
        href: '...'
        rel: '...'
      nullable: true
    Association:
      type: object
      title: Association
      description: MISSING
      properties:
        parentItemId:
          type: string
          description: Parent product UUID or $item[referenceId] to reference the item in the cart.
        childItemIds:
          type: array
          description: Child products UUID or $item[referenceId] to reference the item in the cart.
          items:
            type: string
        type:
          $ref: '#/components/schemas/AssociationType'
    TerminationFeeType:
      title: TerminationFeeType
      type: string
      enum:
      - FIXED
      - PERCENTAGE
    PriceRange:
      type: object
      title: PriceRange
      description: Price definition for an explicit unit range.
      required:
      - min
      - price
      properties:
        min:
          type: number
        max:
          type: number
        price:
          type: number
        salePrice:
          type: string
          format: amount
          description: Regular sale price
        wholesalePrice:
          type: string
          format: amount
          description: Wholesale sale price
      example:
        min: 1
        max: 5
        salePrice: '4.0000000000'
        wholeSalePrice: null
    Definition:
      type: object
      title: Definition
      description: Definition for flat/unit range prices.
      properties:
        price:
          description: Flat price.
          type: number
        priceRanges:
          description: Unit range prices.
          type: array
          items:
            $ref: '#/components/schemas/PriceRange'
    PreAuth:
      title: PreAuth
      type: object
      required:
      - strategy
      properties:
        preAuthId:
          description: Pre-authorization ID from the payment service
          type: string
        status:
          $ref: '#/components/schemas/PreAuthStatus'
        message:
          description: Message returned from the payment gateway.
          type: string
        code:
          description: Code returned from the payment gateway.
          type: string
    PricingStrategy:
      description: Pricing strategy
      type: string
      title: PricingStrategy
      enum:
      - FREE
      - FLAT
      - UNIT
      - TIERED
      - VOLUME
      - VARIABLE_PRICE_STRATEGIES
      - UNLIMITED
      - CUSTOM
    CustomPrice:
      type: object
      title: CustomPrice
      description: Custom price definition.
      required:
      - costId
      - price
      properties:
        costId:
          description: ID of the cost/pricing item for which to override prices.
          type: string
        priceType:
          $ref: '#/components/schemas/CustomPriceType'
        pricingStrategy:
          $ref: '#/components/schemas/PricingStrategy'
        definition:
          $ref: '#/components/schemas/Definition'
      example:
        costId: 9742e09a-e1b4-4b9e-b1a7-66df3e41cebe
        price: 20
    ServiceConfiguration:
      title: ServiceConfiguration
      type: object
      description: Service Configuration
      properties:
        date:
          description: Custom date (YYYY-MM-DD) that determines when the purchased service is activated
          example: '2010-10-19T00:00:00.000Z'
          type: string
          format: date
        strategy:
          $ref: '#/components/schemas/ServiceStrategy'
    RevenueShare:
      title: RevenueShare
      type: object
      description: Revenue shares of the fee sent to AppDirect, the marketplace owner, and the product vendor. The total of all three revenue shares must be 1.00.
      properties:
        appdirect:
          type: number
          description: Revenue share sent to AppDirect, as a fraction of 1.00
          example: '0.00'
        channel:
          type: number
          description: Revenue share sent to the marketplace owner, as a fraction of 1.00
          example: '1.00'
        vendor:
          type: number
          description: Revenue share sent to the product vendor, as a fraction of 1.00
          example: '0.00'
    ShoppingCartCustomAttributes:
      type: object
      title: ShoppingCartCustomAttributes
      description: Collection of custom attributes linked to cart entities
      properties:
        purchase:
          $ref: '#/components/schemas/CustomAttributes'
        buyerUser:
          $ref: '#/components/schemas/CustomAttributes'
        buyerCompany:
          $ref: '#/components/schemas/CustomAttributes'
        ownerUser:
          $ref: '#/components/schemas/CustomAttributes'
        ownerCompany:
          $ref: '#/components/schemas/CustomAttributes'
    CustomContractConfiguration:
      title: CustomContractConfiguration
      type: object
      description: Configuration to use for custom contract
      required:
      - minimumServiceLength
      - minimumServiceLengthUnit
      properties:
        minimumServiceLength:
          description: Minimum pricing duration of the pricing plan
          type: integer
          minimum: 1
        minimumServiceLengthUnit:
          $ref: '#/components/schemas/MinimumServiceLengthUnit'
        endOfContractGracePeriod:
          description: Grace period after the end of the contract
          type: integer
        endOfContractGracePeriodUnit:
          $ref: '#/components/schemas/GracePeriodUnit'
        contractCancellationPeriodLimit:
          description: Contract cancellation period limit
          type: integer
        contractCancellationPeriodUnit:
          $ref: '#/components/schemas/CancellationPeriodUnit'
        continueWithoutContract:
          description: Determines whether to continue the subscription without a contract
          type: boolean
          default: false
        autoExtensionPricingId:
          description: The edition pricing ID to which to bind the contract when it is automatically renewed. To retrieve the value, use the "uuid" value from the "Read payment plan" https://help.appdirect.com/api/appdirect.html#read-payment-plan request.
          type: string
        terminationFeeGracePeriod:
          description: The termination fee grace period
          type: integer
        terminationFeeGracePeriodUnit:
          $ref: '#/components/schemas/GracePeriodUnit'
        blockContractUpgrades:
          description: Determines whether to block upgrades to the contract terms
          type: boolean
          default: false
        blockContractDowngrades:
          description: Determines whether to block downgrades to the contract terms
          type: boolean
          default: false
        blockSwitchToShorterContract:
          description: Determines whether to block the ability to switch to a shorter contract
          type: boolean
          default: false
        keepContractDateOnPlanChange:
          description: Determines whether to keep the contract date if the plan changes
          type: boolean
          default: false
        alignWithParentCycleStartDate:
          description: For add-on products, determines whether to align the contract start date with the parent subscription start date. This is an internal setting.
          type: boolean
          default: false
        unitTerms:
          type: object
          description: List of contract unit terms
          additionalProperties:
            $ref: '#/components/schemas/UnitContractTerms'
        sourceId:
          description: The UUID of the custom contract creator
          type: string
        terminationFee:
          $ref: '#/components/schemas/TerminationFee'
        contractFee:
          type: number
          description: Contract Fee
    Description:
      title: Description
      type: object
      description: Description of the fee
      properties:
        defaultDescription:
          type: string
          description: Description of the fee
          example: Some description here. Valid from {$fromDate} until {$toDate}
        localizedDescriptions:
          type: object
          additionalProperties:
            type: string
          description: Localized description texts. The default is determined by the marketplace's default locale setting.
          example: '{"en_US": "Some description here. Valid from {$fromDate} until {$toDate}", "es_AR": "Alguna descripción acá. Válido desde {$fromDate} hasta {$toDate}"}'
        params:
          type: object
          additionalProperties:
            type: string
          description: Dynamic parameters to populate within descriptions. Reserved for values whose formats need to be localized, such as dates.
          example: '{"fromDate": "2019-10-12 07:20:50.52Z", "toDate": "2020-10-12 07:20:50.52Z"}'
    Currency:
      description: Supported currencies for the system
      type: string
      title: Currency
      enum:
      - USD
      - CAD
      - EUR
      - JPY
      - GBP
      - KRW
      - CHF
      - SEK
      - SGD
      - MYR
      - AUD
      - MXN
      - INR
      - BRL
      - DKK
      - NZD
      - NOK
      - ZAR
      - PHP
      - CNY
      - SAR
      - GTQ
      - IDR
      - ARS
      - COP
      - PEN
      default: USD
    BuyerType:
      type: string
      title: BuyerType
      description: Describes the buyer's relationship with the platform, either CUSTOMER (end user), PLATFORM_OWNER (sales representative) or PARTNER (reseller)
      enum:
      - CUSTOMER
      - PLATFORM_OWNER
      - PARTNER
      default: CUSTOMER
    CustomPriceType:
      title: CustomPriceType
      type: string
      enum:
      - RESELLER_PURCHASE_PRICE
      - MARKETPLACE_RESELLER_PURCHASE_PRICE
    ShoppingCart:
      type: object
      title: ShoppingCart
      description: Shopping cart object
      allOf:
      - properties:
          id:
            type: string
            example: 4f59d160-0e63-45c4-bb91-7ebe873da29f
            description: Shopping cart ID
          createdOn:
            type: string
            example: '2020-10-12 07:20:50.52Z'
            description: Shopping cart creation date
          ownerUserId:
            type: string
            default: ''
            example: 83407ce8-373f-11e6-ac61-9e71128cae77
            description: Cart owner user ID
          ownerCompanyId:
            type: string
            default: ''
            example: a411dc54-d46f-4002-ab00-3ea52e4eb118
            description: Cart owner company ID
          buyerType:
            $ref: '#/components/schemas/BuyerType'
          currency:
            $ref: '#/components/schemas/Currency'
          status:
            type: string
            example: ACTIVE
            description: Shopping cart status
          isBlocked:
            type: boolean
            example: false
            default: false
            description: Shopping Cart is locked waiting for an external event
          paymentMethodId:
            type: string
            default: ''
            example: a411dc54-d46f-4002-ab00-3ea52e4eb118
            description: Payment method ID
          preAuthId:
            type: string
            default: ''
            example: a411dc54-d46f-4002-ab00-3ea52e4eb118
            description: Cart payment pre-authorization ID
          locale:
            type: string
            default: ''
            example: en_US
            description: Locale of shopping cart (ISO 639 language, ISO 3166 country, variant).
          buyerUserId:
            type: string
            default: ''
            example: 83407ce8-373f-11e6-ac61-9e71128cae77
            description: User ID of the buyer (customer, reseller, sales representative) who initiates the purchase
          buyerCompanyId:
            type: string
            default: ''
            example: a411dc54-d46f-4002-ab00-3ea52e4eb118
            description: Buyer company ID
          items:
            type: array
            items:
              $ref: '#/components/schemas/ShoppingCartItem'
          customAttributes:
            allOf:
            - description: Custom attributes for the purchase, buyer, and owner
            - $ref: '#/components/schemas/ShoppingCartCustomAttributes'
          associations:
            type: array
            description: Item associations
            items:
              $ref: '#/components/schemas/Association'
          fees:
            type: array
            description: Cart fees
            items:
              $ref: '#/components/schemas/Fee'
      - $ref: '#/components/schemas/AccreditedAgents'
    AccreditedAgents:
      title: AccreditedAgents
      type: object
      description: Information about the accredited agents associated with shopping carts
      properties:
        accreditedAgents:
          type: array
          items:
            $ref: '#/components/schemas/AccreditedAgent'
    AssociationType:
      title: AssociationType
      type: string
      enum:
      - ADDON
    CancellationPeriodUnit:
      type: string
      title: CancellationPeriodUnit
      description: Cancellation period unit. Time unit by which the contractCancellationPeriodLimit is measured.
      enum:
      - NONE
      - DAY
      example: NONE
    ResourceSupport:
      type: object
      title: ResourceSupport
      description: Resource links
      properties:
        links:
          type: array
          description: Resource links
          items:
            $ref: '#/components/schemas/Link'
      example:
        links:
        - href: '...'
          rel: '...'
        - href: '...'
          rel: '...'
      nullable: true
    MinimumServiceLengthUnit:
      type: string
      title: MinimumServiceLengthUnit
      description: Time unit for contract length. This property must have the same value as the contract length unit configured for the pricing plan.
      enum:
      - DAILY
      - MONTHLY
      - QUARTERLY
      - SIX_MONTHS
      - YEARLY
      - TWO_YEARS
      - THREE_YEARS
      example: MONTHLY
    ItemCustomAttributes:
      type: object
      title: ItemCustomAttributes
      description: Collection of custom attributes
      properties:
        vendorRequiredFields:
          $ref: '#/components/schemas/CustomAttributes'
        subscription:
          $ref: '#/components/schemas/CustomAttributes'
    CustomAttributes:
      type: object
      title: CustomAttributes
      additionalProperties: true
      description: Specify custom attributes as key-value pairs for the purchase. Values can be strings (for text) or string arrays (for checkboxes). Marketplace managers must create the custom attributes in the user interface before they can be used in API calls.
      example:
        customAttributes:
          preferredColours:
          - key_red
          - key_white
          preferredTime: '12:00'
    AccreditedAgent:
      title: AccreditedAgent
      type: object
      description: Details about an accredited agent associated with a shopping cart
      properties:
        userId:
          type: string
          default: ''
          example: 83407ce8-373f-11e6-ac61-9e71128cae77
          description: Accredited agent to whom the purchase is attributed.
        companyId:
          type: string
          default: ''
          example: a411dc54-d46f-4002-ab00-3ea52e4eb118
          description: Company of the accredited agent to whom the purchase is attributed.
    PageMetadata:
      type: object
      title: PageMetadata
      required:
      - number
      - size
      - totalElements
      - totalPages
      properties:
        number:
          description: Page number
          type: number
        size:
          description: Size of the page to be returned
          type: number
        totalElements:
          description: Total number of elements
          type: number
        totalPages:
          description: Total number of pages
          type: number
      example:
