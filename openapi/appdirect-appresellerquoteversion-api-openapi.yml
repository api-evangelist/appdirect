components:
  schemas:
    Company:
      type: object
      title: Company
      properties:
        id:
          type: string
          description: Company ID
        name:
          type: string
          description: Company name
        isReseller:
          type: boolean
          description: Indicate if the company is reseller
      example:
        id: '1'
        name: Acme Corp.
        isReseller: false
    BillingCycle:
      type: object
      title: BillingCycle
      description: The billing cycle
      properties:
        period:
          $ref: '#/components/schemas/PricingPeriod'
        dayOfMonth:
          type: integer
          description: Day of the month on which invoicing should be triggered
      example:
        period: YEARLY
        dayOfMonth: 17
    QuoteVersionSourceType:
      type: string
      title: QuoteVersionSourceType
      description: The source type of the quote version
      enum:
      - OPPORTUNITY
      - QUOTE_V2
      - QUOTE_V1
    CostTypeCategory:
      type: string
      title: CostTypeCategory
      description: Category of cost
      enum:
      - RECURRING
      - ONE_TIME
      example: ONE_TIME
    QuoteVersionSource:
      type: object
      title: QuoteVersionSource
      required:
      - id
      - type
      properties:
        id:
          type: string
          description: The source ID
        type:
          $ref: '#/components/schemas/QuoteVersionSourceType'
      example:
        id: 37f56046-2cec-4bf4-a4e2-5a733dc849a9
        type: OPPORTUNITY
    ExecuteActionResponse:
      type: object
      title: ExecuteActionResponse
      description: The body of an execute action response
      properties:
        quote:
          $ref: '#/components/schemas/QuoteVersion'
      example:
        id: 757d0f09-385c-41df-9781-d6df98584953
        name: API quote version
        createdBy:
          id: d17fee11-c6ce-4f9f-8fb6-9bc55d583699
          company:
            id: d9a6d470-c69a-4403-9355-5953ddcb9efb
        status: PENDING
        availableActions:
        - PRINT_PDF
        - EDIT_NAME
        - SHARE_LINK
        - REVOKE
    PricingTotals:
      type: object
      title: PricingTotals
      description: Details about the taxes, subtotals, totals and recurring totals
      properties:
        amountDueBeforeTax:
          type: string
          description: The amount due before taxes
        amountDueAfterTax:
          type: string
          description: The amount due after taxes
        taxSummary:
          type: array
          description: Details of a specific type of tax applied to a charged cost
          items:
            $ref: '#/components/schemas/TaxDetail'
        recurringTotals:
          type: array
          description: The recurring total charges
          items:
            $ref: '#/components/schemas/QuoteVersionTotalRecurring'
      example:
        amountDueBeforeTax: '55.0000000000'
        amountDueAfterTax: '55.0000000000'
        taxSummary:
        - description: Flat Tax
          taxAmount: '2.0000000000'
        recurringTotals:
        - billingCycle:
            period: MONTHLY
            dayOfMonth: 24
          totalSalePrice: '55.0000000000'
          nextInvoiceDate: '2018-09-24'
    OpportunityPricingStrategy:
      type: string
      title: OpportunityPricingStrategy
      description: Pricing strategy
      enum:
      - FREE
      - FLAT
      - UNIT
      - VOLUME
      - TIERED
      - UNLIMITED
      - CUSTOM
      example: FREE
    QuoteVersionError:
      type: object
      title: QuoteVersionError
      description: A description of the error from the quote version API
      required:
      - status
      - code
      - message
      properties:
        status:
          type: integer
          description: HTTP status code
        code:
          $ref: '#/components/schemas/QuoteVersionErrorCode'
        message:
          type: string
          description: A descriptive error message for debugging
        details:
          type: array
          description: Additional details of the error
          items:
            $ref: '#/components/schemas/QuoteVersionErrorDetails'
      example:
        status: 503
        code: SERVICE_UNAVAILABLE
        message: Unable to reach the service, please contact support@appdirect.com
    PriceRangeItem:
      type: object
      title: PriceRangeItem
      properties:
        min:
          type: string
          description: Minimum number of units for the price range
        max:
          type: string
          description: Maximum number of units for the price range
      example:
        min: '1'
        max: '100'
    Item:
      type: object
      title: Item
      description: Item
      properties:
        id:
          type: string
          description: Item ID
        parentItemId:
          type: string
          description: The parent product's ID, which is only relevant and required for add-on products
        product:
          $ref: '#/components/schemas/OpportunityProduct'
        pricingPlan:
          $ref: '#/components/schemas/PricingPlan'
        pricing:
          type: array
          description: The cost and flat rates for each quantifiable unit
          items:
            $ref: '#/components/schemas/OpportunityPricing'
      example:
        id: 166e0ce6-4309-4a16-ac9b-61bea7ce1cbc
        product:
          id: fa776d2e-cda5-4256-9a27-125a0fe3f448
          name: Supported Product for Opportunity MVP
