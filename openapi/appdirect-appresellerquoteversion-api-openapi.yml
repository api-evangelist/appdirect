                        company:
                          id: 05ba75d3-3637-4a7a-807d-f2cb66466348
                      customerUser:
                        id: d17fee11-c6ce-4f9f-8fb6-9bc55d583699
                        email: jane.smith@company.com
                        firstName: Jane
