    QuoteVersionTotalRecurring:
      type: object
      title: QuoteVersionTotalRecurring
      description: Details about the recurring total charges
      properties:
        billingCycle:
          $ref: '#/components/schemas/BillingCycle'
        totalSalePrice:
          type: string
          description: The total sale price
        nextInvoiceDate:
          type: string
          description: The next invoice date in the format YYYY-MM-DD
      example:
        recurringTotals:
        - billingCycle:
            period: MONTHLY
            dayOfMonth: 28
          totalSalePrice: '55.0000000000'
          nextInvoiceDate: '2018-09-28'
    CostType:
      type: string
      title: CostType
      description: Type of cost
      enum:
      - RECURRING_FLAT
      - ONE_TIME_FLAT
      - INCLUDED
      - SETUP_PER_UNIT
      - RECURRING_PER_UNIT
      - ONE_TIME_PER_UNIT
      - SETUP_FEE
      - CONTRACT_FEE
      - DISCOUNT_PER_UNIT
      - DISCOUNT_FLAT
      - METERED_USAGE
      example: RECURRING_PER_UNIT
    QuoteVersionErrorDetails:
      type: object
      title: QuoteVersionErrorDetails
      description: Additional error details returned after a failed quote API call
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          description: The field related to the error
        code:
          $ref: '#/components/schemas/QuoteVersionErrorCode'
        message:
          type: string
          description: Error description
      example:
        field: Source type
        code: BAD_REQUEST
        message: Source type not defined
    PricingPlan:
      type: object
      title: PricingPlan
      properties:
        id:
          type: string
          description: Pricing plan ID
        name:
          type: string
          description: Pricing plan name
      example:
        id: 031d9ed2-3df1-44f5-876a-6b4318ba7bdb
        name: Recurring Edition with Unlimited Included Users
    QuoteVersionErrorCode:
      type: string
      title: QuoteVersionErrorCode
      description: The error code associated with the response
      enum:
      - SERVICE_UNAVAILABLE
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - CONFLICT
      - BAD_REQUEST
      - OPPORTUNITY_READ_ERROR
      - OPPORTUNITY_SUMMARY_READ_ERROR
      - OPPORTUNITY_ALREADY_CLOSED
      - UNKNOWN
      - QUOTE_CREATION_ERROR
      - QUOTE_READING_ERROR
      - QUOTE_EDITION_ERROR
      - QUOTE_ITEMS_EMPTY
      example: BAD_REQUEST
    PageMetadata:
      type: object
      title: PageMetadata
      required:
      - number
      - size
      - totalElements
      - totalPages
      properties:
        number:
          description: Page number
          type: number
        size:
          description: Size of the page to be returned
          type: number
        totalElements:
          description: Total number of elements
          type: number
        totalPages:
          description: Total number of pages
          type: number
      example:
        number: 12345
        size: 12345
        totalElements: 12345
        totalPages: 12345
