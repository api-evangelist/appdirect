        explode: false
        schema:
          type: array
          items:
            type: string
          enum:
          - ONLY_ACTIVE
          - ONLY_INACTIVE
          - ONLY_PENDING_INVITE
      - name: searchText
        in: query
        description: Search text
        required: false
        schema:
          type: string
      - name: fromDate
        in: query
        required: false
        description: From date, in timestamp format
        schema:
          type: string
      - name: toDate
        in: query
        required: false
        description: To date, in timestamp format
        schema:
          type: string
      - name: sortField
        in: query
        required: false
        description: Field to sort by
        schema:
          type: string
          enum:
          - CUSTOMER_ID
          - EMAIL
          - FIRST_NAME
      - name: sortOrder
        in: query
        required: false
        description: Sort order
        schema:
          type: string
      - name: page
