        ROLE_RESELLER_MANAGER:
        - Allows access as a Reseller Manager for the company.
      parameters:
      - name: context
        in: query
        description: Supported AppReseller contexts
        required: true
        schema:
          type: string
          enum:
          - RESELLER, RESELLER_MANAGER
      - name: companyId
        in: path
        description: Company ID
        required: true
        schema:
          type: string
      responses:
