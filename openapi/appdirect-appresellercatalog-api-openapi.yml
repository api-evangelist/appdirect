    PageMetadata:
      type: object
      title: PageMetadata
      required:
      - number
      - size
      - totalElements
      - totalPages
      properties:
        number:
          description: Page number
          type: number
        size:
          description: Size of the page to be returned
          type: number
        totalElements:
          description: Total number of elements
          type: number
        totalPages:
          description: Total number of pages
          type: number
      example:
        number: 12345
        size: 12345
        totalElements: 12345
        totalPages: 12345
    PricingDuration:
      description: Pricing duration types
      type: string
      title: PricingDuration
      enum:
      - ONE_TIME
      - MONTHLY
      - QUARTERLY
      - SIX_MONTHS
      - YEARLY
      - TWO_YEARS
      - THREE_YEARS
      - DAILY
    AppResellerCatalogEditionWS:
      type: object
      title: CatalogEdition
      properties:
        id:
          description: Edition ID
          type: string
        name:
          description: Edition name
          type: string
        RevenueModelType:
          $ref: '#/components/schemas/RevenueModelType'
        PaymentPlanWS:
          type: array
          items:
            $ref: '#/components/schemas/AppResellerCatalogPaymentPlanWS'
    MarkupPricingType:
      description: Markup pricing types
      type: string
      title: MarkupPricingType
      enum:
      - RESELLER
      - WHOLESALE
      - CHANNEL_RESELLER_COMPANY
      - CHANNEL_RESELLER
      - CHANNEL
      - CHANNEL_ONLY
      - NONE
      - ALL
    PricingStrategy:
      description: Pricing strategy
      type: string
      title: PricingStrategy
      enum:
      - FREE
      - FLAT
      - UNIT
      - TIERED
      - VOLUME
      - VARIABLE_PRICE_STRATEGIES
      - UNLIMITED
      - CUSTOM
    AppResellerCatalogMarkupPriceWS:
      type: object
      title: MarkupPrices
      properties:
        markupType:
          $ref: '#/components/schemas/MarkupPricingType'
        markupPrices:
          description: Markup Prices
          additionalProperties:
            type: string
            properties:
              currency:
                type: string
              value:
                type: number
