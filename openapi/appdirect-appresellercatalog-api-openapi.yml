openapi: 3.0.0
info:
  description: The Companies API allows developers to manage marketplace companies and their user memberships.
  title: Companies AI Embed AppResellerCatalog API
  license:
    name: Apache License, Version 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  version: v296.0-SNAPSHOT
servers:
- url: https://marketplace.appdirect.com/api
- url: https://virtserver.swaggerhub.com
tags:
- name: AppResellerCatalog
  x-displayName: Reseller Catalog
paths:
  /appReseller/v1/catalog/sellableProducts:
    get:
      description: Retrieve all products that a Reseller can sell.
      tags:
      - AppResellerCatalog
      summary: List sellable products
      x-appdirect-api-stage: Early Access
      operationId: sellableProducts_AppResellerCatalogV1Api_get_GET
      x-appdirect-required-scopes:
        ROLE_RESELLER:
        - Allows access as a Reseller for the company.
      parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
      - name: size
        in: query
        description: Number of results per page
        required: false
        schema:
          type: integer
      - name: searchText
        in: query
        description: Search text
        required: false
        schema:
          type: string
      - name: targetUserId
        in: query
        description: Current user ID
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResellerCatalogProductPageWS'
              examples:
                response:
                  value:
                    links: []
                    content:
                    - id: cf6ab187-000a-4571-8089-000019d68801
                      name: Product name 1
                      blurb: Product 1 short description
                      provider: Appdirect
                      imageUrl: https://appdirect.com/resource1
                      visible: true
                    - id: 9b997bfc-000a-4ee3-b9f2-66d634ee993f
                      name: Product name 2
                      blurb: Product 2 short description
                      provider: Appdirect
                      imageUrl: https://appdirect.com/resource2
                      visible: true
                    page:
                      size: 50
                      totalElements: 2
                      totalPages: 1
                      number: 0
        '401':
          description: Unauthorized
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request GET \\\n  --url 'https://marketplace.appdirect.com/api/appReseller/v1/catalog/sellableProducts?page=SOME_INTEGER_VALUE&size=SOME_INTEGER_VALUE&searchText=SOME_STRING_VALUE&targetUserId=SOME_STRING_VALUE'"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://marketplace.appdirect.com/api/appReseller/v1/catalog/sellableProducts',\n  qs: {\n    page: 'SOME_INTEGER_VALUE',\n    size: 'SOME_INTEGER_VALUE',\n    searchText: 'SOME_STRING_VALUE',\n    targetUserId: 'SOME_STRING_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/appReseller/v1/catalog/sellableProducts?page=SOME_INTEGER_VALUE&size=SOME_INTEGER_VALUE&searchText=SOME_STRING_VALUE&targetUserId=SOME_STRING_VALUE\")\n  .get()\n  .build();\n\nResponse response = client.newCall(request).execute();"
  /appReseller/v1/catalog/sellableProducts/{productId}/editions:
    get:
      description: Get product editions, costs and markups.
      tags:
      - AppResellerCatalog
      summary: Edition details
      x-appdirect-api-stage: Early Access
      operationId: sellableProductEditions_AppResellerCatalogV1Api_get_GET
      x-appdirect-required-scopes:
        ROLE_RESELLER:
        - Allows access as a Reseller for the company.
      parameters:
      - name: productId
        in: path
        description: Product ID
        required: true
        schema:
          type: string
      - name: targetUserId
        in: query
        description: User ID
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppResellerCatalogEditionWS'
              examples:
                response:
                  value:
                  - id: 12fe4576-0000-4d7b-bdf4-0000cd112b27
                    name: IT HelpDesk Session
                    revenueType: ONE_TIME
                    paymentPlans:
                    - id: 28e14ece-00a0-0055-8000-0000c4c8e329
                      frequency: ONE_TIME
                      minimumServiceLength: null
                      cancellationPeriodLimit: null
                      endOfContractGracePeriod: null
                      costs:
                      - id: 54479
                        unit: SESSION
                        unitDependency: null
                        pricingStrategy: UNIT
                        minUnits: 0
                        maxUnits: 111
                        itemPrices:
                          CAD: 60
                          GBP: 60
                          USD: 60
                          IDR: 0
                        markupPrices:
                        - markupType: CHANNEL_RESELLER_COMPANY
                          markupPrices:
                            USD: 898989
        '401':
          description: Unauthorized
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request GET \\\n  --url 'https://marketplace.appdirect.com/api/appReseller/v1/catalog/sellableProducts/%7BproductId%7D/editions?targetUserId=SOME_STRING_VALUE'"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://marketplace.appdirect.com/api/appReseller/v1/catalog/sellableProducts/%7BproductId%7D/editions',\n  qs: {targetUserId: 'SOME_STRING_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: Java + Okhttp
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://marketplace.appdirect.com/api/appReseller/v1/catalog/sellableProducts/%7BproductId%7D/editions?targetUserId=SOME_STRING_VALUE\")\n  .get()\n  .build();\n\nResponse response = client.newCall(request).execute();"
components:
  schemas:
    AppResellerCatalogProductWS:
      type: object
      title: ProductCatalog
      properties:
        id:
          description: Product ID
          type: string
        name:
          description: Product name
          type: string
        blurb:
          description: Product short description
          type: string
        provider:
          description: Company provider
          type: string
        imageUrl:
          description: Product image URL
          type: string
        visible:
          description: Determines whether product is visible in catalog (true/false)
          type: boolean
    RevenueModelType:
      description: Supported revenue model types
      type: string
      title: RevenueModelType
      enum:
      - FREE
      - ONE_TIME
      - RECURRING
      - TIERED
    AppResellerCatalogPlanCostWS:
      type: object
      title: CatalogPlanCosts
      properties:
        id:
          description: Plan Cost ID
          type: string
        unit:
          $ref: '#/components/schemas/PricingUnit'
        unitDependency:
          $ref: '#/components/schemas/PricingUnit'
        pricingStrategy:
          $ref: '#/components/schemas/PricingStrategy'
        minUnits:
          description: Minimum number of units
          type: integer
        maxUnits:
          description: Maximum number of units
          type: integer
        itemPrices:
          description: Payment Plan prices
          additionalProperties:
            type: string
            properties:
              currency:
                type: string
              value:
                type: number
        markupPrices:
          type: array
          items:
            $ref: '#/components/schemas/AppResellerCatalogMarkupPriceWS'
    AppResellerCatalogProductPageWS:
      type: object
      title: ProductCatalogPage
      properties:
        links:
          type: array
          items:
            type: string
        content:
          type: array
          items:
            $ref: '#/components/schemas/AppResellerCatalogProductWS'
        page:
          $ref: '#/components/schemas/PageMetadata'
    AppResellerCatalogPaymentPlanWS:
      type: object
      title: PaymentPlans
      properties:
        id:
          description: Payment Plan ID
          type: string
        frecuency:
          $ref: '#/components/schemas/PricingDuration'
        minimumServiceLength:
          description: Minimum pricing duration of the pricing plan
          type: integer
        cancellationPeriodLimit:
          description: Number of days where you can cancel your contract
          type: integer
        endOfContractGracePeriod:
          description: Grace period after the end of the contract
          type: integer
        costs:
          description: Catalog plan costs
          type: array
          items:
            $ref: '#/components/schemas/AppResellerCatalogPlanCostWS'
