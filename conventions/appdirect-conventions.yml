custom_headers:
- name: AD-Tenant
  purpose: Target a specific marketplace tenant.
- name: AD-Public-Developer-Key
  purpose: Public developer key for shopping-cart / storefront integration calls.
- name: AD-ShoppingCart-Partner
  purpose: Identify the shopping-cart partner context.
- name: AD-Timezone
  purpose: Caller timezone for date handling.
- name: Accept-Language
  purpose: Localization / content language negotiation.
rate_limiting:
