aid: appdirect
name: AppDirect
description: >-
  AppDirect is a subscription commerce platform that powers B2B digital marketplaces,
  billing, provisioning, and reseller/distribution channels for millions of cloud
  subscriptions worldwide. Its developer platform exposes OAuth 2.0-authenticated REST
  and GraphQL APIs to manage companies, users and memberships, products and editions,
  subscriptions and assignments, invoices and metered usage billing, and to receive
  real-time webhooks. AppDirect also ships Devs.ai, an API for building LLM/agent
  experiences, plus a Storefront Toolkit CLI and embeddable UI components. Enriched
  from the public developer portal, OpenAPI specs, and live probes by the API Evangelist
  pipeline.
